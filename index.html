<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Медрота — графік чергувань</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ───────── Довідники ───────── */

const ROLES = ["Управління", "Лікар", "Фельдшер", "Медсестра/брат", "Статист", "Аптека", "Водій", "Санітар", "Кухар", "Інше"];
const DOC_ROLE = "Лікар";
const SPECIALTIES = ["Хірург", "Травматолог", "Терапевт", "Анестезіолог", "Стоматолог", "Інше"];

const ANY = "any"; // місце без вимоги до категорії

const DEFAULT_POSTS = [
  { id: "stab",   name: "Стабпункт",    short: "СТ", color: "#4a6b2f", req: { [ANY]: 2 }, daily: true },
  { id: "amb",    name: "Амбулаторія",  short: "АМ", color: "#2f6f9f", req: { [ANY]: 1 }, daily: true },
  { id: "travma", name: "Травмпункт",   short: "ТР", color: "#a8402f", req: { "Лікар": 1, "Фельдшер": 1, "Санітар": 1 }, daily: true },
  { id: "stac",   name: "Стаціонар",    short: "СЦ", color: "#2e8572", req: { [ANY]: 2 }, daily: true },
  { id: "kuhnya", name: "Кухня",        short: "КХ", color: "#a87514", req: { "Кухар": 1 }, daily: false },
];

const WD = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const MONTHS = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];

const DEMO_PEOPLE = [
  { name: "Коваленко О.В.", rank: "майор м/с",  role: "Лікар", specialty: "Хірург",      posts: ["stab","travma","stac"] },
  { name: "Шевченко І.М.",  rank: "капітан м/с", role: "Лікар", specialty: "Терапевт",    posts: ["amb","stac"] },
  { name: "Бондаренко Т.С.",rank: "ст. лейтенант м/с", role: "Лікар", specialty: "Травматолог", posts: ["travma","stab"] },
  { name: "Мельник В.П.",   rank: "ст. сержант", role: "Фельдшер",       posts: ["stab","travma","amb"] },
  { name: "Ткаченко Д.О.",  rank: "сержант",     role: "Фельдшер",       posts: ["stab","stac"] },
  { name: "Кравченко Ю.А.", rank: "солдат",      role: "Фельдшер",       posts: ["amb","travma"] },
  { name: "Олійник Н.І.",   rank: "сержант",     role: "Медсестра/брат", posts: ["stac"] },
  { name: "Поліщук С.В.",   rank: "солдат",      role: "Медсестра/брат", posts: ["stac","amb"] },
  { name: "Лисенко А.Р.",   rank: "ст. солдат",  role: "Водій",          posts: ["stab","travma"] },
  { name: "Савченко М.М.",  rank: "солдат",      role: "Водій",          posts: ["stab"] },
  { name: "Руденко П.Г.",   rank: "солдат",      role: "Санітар",        posts: ["stac","travma"] },
  { name: "Марченко К.Л.",  rank: "солдат",      role: "Санітар",        posts: ["stac","stab","travma"] },
  { name: "Гриценко В.Д.",  rank: "солдат",      role: "Кухар",          posts: ["kuhnya"] },
  { name: "Захарченко О.О.",rank: "солдат",      role: "Кухар",          posts: ["kuhnya"] },
];

/* ───────── Утиліти ───────── */

const uid = () => Math.random().toString(36).slice(2, 10);
const pad2 = (n) => String(n).padStart(2, "0");
const ymOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const wdOf = (ym, day) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, day).getDay(); };
const shiftYm = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return ymOf(d); };

/* вимоги поста: {категорія|any: кількість}; старі дані мали лише slots */
const normReq = (post) => (post.req && typeof post.req === "object" ? post.req : { [ANY]: post.slots || 1 });
const totalReq = (post) => Object.values(normReq(post)).reduce((s, n) => s + (Number(n) || 0), 0);
const reqLabel = (key) => (key === ANY ? "Будь-хто" : key);

/* вимоги до лікарів на посту: список груп {specialties: [...], count}. Кожна група — окрема вимога
   на N лікарів БУДЬ-ЯКОЇ зі спеціальностей у її списку (напр. {specialties:["Хірург","Травматолог"], count:1}
   означає «1 лікар — хірург або травматолог»). Кілька груп можна вимагати одночасно (напр. окрема група для
   хірурга і окрема для терапевта — щоб точно був і той, і той); решта лікарських місць — будь-яка спеціальність.
   Сумісність зі старими даними: одна спеціальність на пост (docSpecialty) чи мапа спеціальність→кількість
   (docSpecReq) читаються так само, як групи. */
const normDocGroups = (post) => {
  if (Array.isArray(post.docGroups)) {
    return post.docGroups.filter((g) => g && Array.isArray(g.specialties) && g.specialties.length && g.count > 0);
  }
  if (post.docSpecReq && typeof post.docSpecReq === "object") {
    return Object.entries(post.docSpecReq).filter(([, n]) => n > 0).map(([spec, n]) => ({ specialties: [spec], count: n }));
  }
  if (post.docSpecialty) return [{ specialties: [post.docSpecialty], count: normReq(post)[DOC_ROLE] || 1 }];
  return [];
};

const reqText = (post) => {
  const req = normReq(post);
  const groups = normDocGroups(post);
  const groupsSum = groups.reduce((s, g) => s + (Number(g.count) || 0), 0);
  const parts = [];
  Object.entries(req).filter(([, n]) => n > 0).forEach(([k, n]) => {
    if (k === DOC_ROLE) {
      groups.forEach((g) => { if (g.count > 0) parts.push(`${g.count} Лікар (${g.specialties.join("/")})`); });
      const rest = n - groupsSum;
      if (rest > 0) parts.push(`${rest} Лікар`);
    } else {
      parts.push(`${n} ${reqLabel(k)}`);
    }
  });
  return parts.join(" · ");
};

/* якщо пост одночасно вимагає і конкретних лікарів, і «будь-кого» — лікарі понад лікарську квоту
   не повинні йти закривати місця «будь-хто» (їх краще лишити для інших постів, де вони теж лікарі) */
const anyExcludesDoctors = (post) => {
  const req = normReq(post);
  return (req[DOC_ROLE] || 0) > 0 && (req[ANY] || 0) > 0;
};

/* докладний розрахунок покриття поста: спершу лікарів розподіляють по групах вимог до спеціальності
   (кожна група — окремо, у порядку заведення), а решту призначених — по звичайних категоріях;
   хто не поміщається — «зайві» (йдуть у будь-хто, окрім лікарів понад квоту на посту, що вимагає і лікарів,
   і будь-кого) */
const computeCoverage = (post, assigned) => {
  const left = { ...normReq(post) };
  const groups = normDocGroups(post).map((g) => ({ specialties: g.specialties, remaining: g.count }));
  const excludeDoctors = anyExcludesDoctors(post);
  const used = new Set();
  groups.forEach((group) => {
    assigned.forEach((p, i) => {
      if (used.has(i) || group.remaining <= 0) return;
      if (p.role === DOC_ROLE && p.specialty && group.specialties.includes(p.specialty) && left[DOC_ROLE] > 0) {
        group.remaining--;
        left[DOC_ROLE]--;
        used.add(i);
      }
    });
  });
  let extra = 0;
  assigned.forEach((p, i) => {
    if (used.has(i)) return;
    if (left[p.role] > 0) { left[p.role]--; return; }
    if (p.role === DOC_ROLE && excludeDoctors) return;
    extra++;
  });
  left[ANY] = Math.max(0, (left[ANY] || 0) - extra);
  return { left, groups };
};

/* скільки і кого бракує на посту в конкретний день */
const evalCoverage = (post, assigned) => {
  const { left, groups } = computeCoverage(post, assigned);
  const groupsSum = groups.reduce((s, g) => s + Math.max(0, g.remaining), 0);
  const missing = [];
  groups.forEach((g) => { if (g.remaining > 0) missing.push(`${g.remaining} Лікар (${g.specialties.join("/")})`); });
  ROLES.forEach((r) => {
    if (r === DOC_ROLE) {
      const rest = left[DOC_ROLE] - groupsSum;
      if (rest > 0) missing.push(`${rest} Лікар`);
      return;
    }
    if (left[r] > 0) missing.push(`${left[r]} ${r}`);
  });
  if (left[ANY] > 0) missing.push(`${left[ANY]} будь-хто`);
  return { have: assigned.length, need: totalReq(post), missing };
};

/* сумісність зі старими збереженими даними: slots -> req (старі спеціальності лікарів читаються
   динамічно через normDocGroups, без потреби у міграції на диску) */
const migratePost = (p) => (p.req ? p : { ...p, req: { [ANY]: p.slots || 1 } });

const STORAGE_KEY = "medrota-duty-v1";

/* ───────── Головний компонент ───────── */

function DutyRoster() {
  const today = new Date();
  const [tab, setTab] = useState("grid");
  const [ym, setYm] = useState(ymOf(today));
  const [people, setPeople] = useState([]);
  const [posts, setPosts] = useState(DEFAULT_POSTS);
  const [schedule, setSchedule] = useState({}); // {ym: {personId: {day: postId}}}
  const [restDays, setRestDays] = useState(2);
  const [colorPrint, setColorPrint] = useState(false); // друк/експорт зі збереженням кольорів постів
  const [tool, setTool] = useState(DEFAULT_POSTS[0].id); // обраний пост або "erase"
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);
  const isCurrentMonth = ym === ymOf(today);
  const [autoFrom, setAutoFrom] = useState(isCurrentMonth ? today.getDate() : 1);
  const [autoDays, setAutoDays] = useState(daysIn(ym) - (isCurrentMonth ? today.getDate() - 1 : 0));
  const [filterDay, setFilterDay] = useState(null); // показати лише тих, хто в наряді у це число
  const prevYmRef = useRef(ym);

  /* завантаження */
  useEffect(() => {
    try {
      const r = localStorage.getItem(STORAGE_KEY);
      if (r) {
        const d = JSON.parse(r);
        if (d.people) setPeople(d.people);
        if (d.posts) setPosts(d.posts.map(migratePost));
        if (d.schedule) setSchedule(d.schedule);
        if (d.restDays != null) setRestDays(d.restDays);
        if (d.autoFrom != null) setAutoFrom(d.autoFrom);
        if (d.autoDays != null) setAutoDays(d.autoDays);
      }
    } catch (e) { /* перший запуск — даних ще немає */ }
    setLoaded(true);
  }, []);

  /* збереження з затримкою */
  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ people, posts, schedule, restDays, autoFrom, autoDays }));
      } catch (e) { console.error("Не вдалося зберегти", e); }
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [people, posts, schedule, restDays, autoFrom, autoDays, loaded]);

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const days = daysIn(ym);
  /* при переході на інший місяць (а не при першому завантаженні сторінки,
     щоб не затерти збережений користувачем вибір) пропонуємо нові значення за замовчуванням */
  useEffect(() => {
    if (prevYmRef.current === ym) return;
    prevYmRef.current = ym;
    const t = new Date();
    const start = ymOf(t) === ym ? t.getDate() : 1;
    setAutoFrom(start);
    setAutoDays(daysIn(ym) - start + 1);
    setFilterDay(null);
  }, [ym]);
  const autoFromClamped = Math.min(Math.max(1, autoFrom || 1), days);
  const autoDaysClamped = Math.min(Math.max(1, autoDays || 1), days - autoFromClamped + 1);
  const monthSched = schedule[ym] || {};
  const postById = useMemo(() => Object.fromEntries(posts.map((p) => [p.id, p])), [posts]);

  const isToday = (day) => {
    const t = new Date();
    return ymOf(t) === ym && t.getDate() === day;
  };

  /* ── редагування клітинки ── */
  const setCell = (personId, day, postId) => {
    setSchedule((prev) => {
      const m = { ...(prev[ym] || {}) };
      const row = { ...(m[personId] || {}) };
      if (postId === null || row[day] === postId) delete row[day];
      else row[day] = postId;
      m[personId] = row;
      return { ...prev, [ym]: m };
    });
  };

  /* призначає/знімає весь блок днів «зміни» посту одразу (напр. цілий тиждень), починаючи з клітинки, по якій клікнули */
  const setCellRange = (personId, dayFrom, dayTo, postId) => {
    setSchedule((prev) => {
      const m = { ...(prev[ym] || {}) };
      const row = { ...(m[personId] || {}) };
      let allSame = true;
      for (let d = dayFrom; d <= dayTo; d++) if (row[d] !== postId) { allSame = false; break; }
      for (let d = dayFrom; d <= dayTo; d++) { if (allSame) delete row[d]; else row[d] = postId; }
      m[personId] = row;
      return { ...prev, [ym]: m };
    });
  };

  const cellClick = (personId, day) => {
    if (tool === "erase") { setCell(personId, day, null); return; }
    const tour = Math.max(1, Number(postById[tool]?.tourDays) || 1);
    if (tour <= 1) { setCell(personId, day, tool); return; }
    setCellRange(personId, day, Math.min(days, day + tour - 1), tool);
  };

  /* ── перевірки ── */
  const hasDuty = (sched, personId, day) => !!(sched[personId] && sched[personId][day]);
  const isDailyPost = (postId) => postById[postId]?.daily !== false;

  /* відпочинок враховується лише між нарядами на добові (24-год) пости —
     звичайні пости на цю перевірку не впливають */
  const restConflict = (sched, personId, day, postId) => {
    if (!isDailyPost(postId)) return false;
    for (let k = 1; k <= restDays; k++) {
      if (day - k >= 1 && hasDuty(sched, personId, day - k) && isDailyPost(sched[personId][day - k])) return true;
      if (day + k <= days && hasDuty(sched, personId, day + k) && isDailyPost(sched[personId][day + k])) return true;
    }
    return false;
  };

  const coverage = useMemo(() => {
    // {postId: {day: {have, need, missing}}}
    const byDay = {}; // {postId: {day: [people]}}
    posts.forEach((p) => { byDay[p.id] = {}; });
    people.forEach((p) => {
      const row = monthSched[p.id] || {};
      Object.entries(row).forEach(([d, pid]) => {
        if (byDay[pid]) (byDay[pid][d] = byDay[pid][d] || []).push(p);
      });
    });
    const cov = {};
    posts.forEach((post) => {
      cov[post.id] = {};
      for (let d = 1; d <= days; d++) cov[post.id][d] = evalCoverage(post, byDay[post.id][d] || []);
    });
    return cov;
  }, [monthSched, posts, people, days]);

  const dutyCount = (personId) => Object.keys(monthSched[personId] || {}).length;

  /* ── авторозподіл ── */
  const autoFill = () => {
    const fromDay = autoFromClamped;
    const toDay = Math.min(days, fromDay + autoDaysClamped - 1);
    const sched = {};
    Object.entries(monthSched).forEach(([pid, row]) => { sched[pid] = { ...row }; });
    const counts = {}; // загальне навантаження людини (усі пости)
    people.forEach((p) => { counts[p.id] = Object.keys(sched[p.id] || {}).length; });
    // навантаження людини по кожному конкретному посту — щоб ротація на цей пост не залежала
    // від того, наскільки людина зайнята на ІНШИХ постах (інакше той, хто рідко ходить деінде,
    // раз у раз повторно потрапляє саме на цей пост, бо його загальний лік лишається найменшим)
    const postCounts = {};
    posts.forEach((post) => { postCounts[post.id] = {}; });
    people.forEach((p) => {
      Object.values(sched[p.id] || {}).forEach((pid) => {
        if (!postCounts[pid]) postCounts[pid] = {};
        postCounts[pid][p.id] = (postCounts[pid][p.id] || 0) + 1;
      });
    });
    let unfilled = 0;

    const byRotation = (post) => (a, b) =>
      (postCounts[post.id][a.id] || 0) - (postCounts[post.id][b.id] || 0) ||
      counts[a.id] - counts[b.id] ||
      a.name.localeCompare(b.name, "uk");

    const pickFor = (post, day, role, specialties) => {
      const cands = people
        .filter((p) => p.active !== false && p.posts.includes(post.id))
        .filter((p) => !role || p.role === role)
        .filter((p) => role || p.role !== DOC_ROLE || !anyExcludesDoctors(post))
        .filter((p) => role !== DOC_ROLE || !specialties || specialties.includes(p.specialty))
        .filter((p) => !hasDuty(sched, p.id, day))
        .filter((p) => !restConflict(sched, p.id, day, post.id))
        .sort(byRotation(post));
      if (!cands.length) return false;
      const pick = cands[0];
      if (!sched[pick.id]) sched[pick.id] = {};
      sched[pick.id][day] = post.id;
      counts[pick.id]++;
      postCounts[post.id][pick.id] = (postCounts[post.id][pick.id] || 0) + 1;
      return true;
    };

    /* та сама людина закриває весь блок днів «зміни» посту (напр. цілий тиждень) */
    const pickForRange = (post, dayFrom, dayTo, role, specialties) => {
      const cands = people
        .filter((p) => p.active !== false && p.posts.includes(post.id))
        .filter((p) => !role || p.role === role)
        .filter((p) => role || p.role !== DOC_ROLE || !anyExcludesDoctors(post))
        .filter((p) => role !== DOC_ROLE || !specialties || specialties.includes(p.specialty))
        .filter((p) => {
          for (let d = dayFrom; d <= dayTo; d++) {
            if (hasDuty(sched, p.id, d) || restConflict(sched, p.id, d, post.id)) return false;
          }
          return true;
        })
        // не ставити людину впритул до її ж власної зміни на цьому самому посту (ні до, ні після) —
        // інакше вона може отримати два терміни підряд без перерви між ними
        .filter((p) => sched[p.id]?.[dayFrom - 1] !== post.id && sched[p.id]?.[dayTo + 1] !== post.id)
        .sort(byRotation(post));
      if (!cands.length) return false;
      const pick = cands[0];
      if (!sched[pick.id]) sched[pick.id] = {};
      const span = dayTo - dayFrom + 1;
      for (let d = dayFrom; d <= dayTo; d++) sched[pick.id][d] = post.id;
      counts[pick.id] += span;
      postCounts[post.id][pick.id] = (postCounts[post.id][pick.id] || 0) + span;
      return true;
    };

    // скільки ще треба з урахуванням уже проставленого (по категоріях і по спеціальностях лікарів)
    const leftFor = (post, day) => {
      const assigned = people.filter((p) => sched[p.id] && sched[p.id][day] === post.id);
      return computeCoverage(post, assigned);
    };

    const tourOf = (post) => Math.max(1, Number(post.tourDays) || 1);
    const dayByDayPosts = posts.filter((post) => tourOf(post) === 1);
    const tourPosts = posts.filter((post) => tourOf(post) > 1);

    // хто саме і скільки днів вже відпрацював у поточній зміні на кінець попереднього місяця
    // (щоб не переривати зміну на межі місяців і не перезапускати ротацію з чистого аркуша)
    const prevYm = shiftYm(ym, -1);
    const prevSched = schedule[prevYm] || {};
    const prevDays = daysIn(prevYm);

    // пости з багатоденною зміною: одна людина/команда закриває блок днів одразу, але не чіпає дні,
    // де для цього посту вже є будь-яке призначення (ручне чи з попереднього прогону) — заповнюються
    // лише прогалини (і лише те, чого справді бракує), розміром не довшим за тривалість зміни
    tourPosts.forEach((post) => {
      const tour = tourOf(post);

      // донести з минулого місяця незавершену зміну тим самим людям, перш ніж починати нову ротацію
      if (fromDay === 1) {
        people.forEach((p) => {
          if (p.active === false || !p.posts.includes(post.id)) return;
          const row = prevSched[p.id] || {};
          if (row[prevDays] !== post.id) return;
          let streak = 0;
          for (let d = prevDays; d >= 1 && row[d] === post.id; d--) streak++;
          if (streak >= tour) return; // зміна вже завершилась рівно на кінець місяця — далі звичайна ротація
          const remaining = Math.min(toDay, tour - streak);
          for (let d = 1; d <= remaining; d++) { if (hasDuty(sched, p.id, d)) return; }
          for (let d = 1; d <= remaining; d++) {
            if (!sched[p.id]) sched[p.id] = {};
            sched[p.id][d] = post.id;
          }
          counts[p.id] = (counts[p.id] || 0) + remaining;
          postCounts[post.id][p.id] = (postCounts[post.id][p.id] || 0) + remaining;
        });
      }

      let day = fromDay;
      while (day <= toDay) {
        const cov = leftFor(post, day);
        const { left, groups } = cov;
        const groupsSum = groups.reduce((s, g) => s + Math.max(0, g.remaining), 0);
        const roleNeeds = ROLES.map((role) => (left[role] || 0) - (role === DOC_ROLE ? groupsSum : 0));
        const roleLeftSum = roleNeeds.reduce((s, n) => s + Math.max(0, n), 0);
        const anyLeft = Math.max(0, left[ANY] || 0);
        if (groupsSum + roleLeftSum + anyLeft <= 0) {
          day++; // день уже повністю закритий (вручну або раніше) — не чіпаємо
          continue;
        }
        // блок для заповнення прогалини: не довший за тривалість зміни й не заходить у дні з іншим
        // «профілем нестачі» (там уже щось інакше закрито вручну чи раніше — не наїжджаємо на це)
        const sig = JSON.stringify(cov);
        let blockEnd = Math.min(toDay, day + tour - 1);
        for (let d = day + 1; d <= blockEnd; d++) {
          if (JSON.stringify(leftFor(post, d)) !== sig) { blockEnd = d - 1; break; }
        }
        groups.forEach((g) => {
          for (let k = g.remaining; k > 0; k--) {
            if (!pickForRange(post, day, blockEnd, DOC_ROLE, g.specialties)) unfilled += blockEnd - day + 1;
          }
        });
        ROLES.forEach((role, i) => {
          for (let k = roleNeeds[i]; k > 0; k--) {
            if (!pickForRange(post, day, blockEnd, role, null)) unfilled += blockEnd - day + 1;
          }
        });
        for (let k = anyLeft; k > 0; k--) {
          if (!pickForRange(post, day, blockEnd, null, null)) unfilled += blockEnd - day + 1;
        }
        day = blockEnd + 1;
      }
    });

    // пас 1: місця з вимогою категорії/спеціальності — дефіцитніші, їх ставимо першими
    dayByDayPosts.forEach((post) => {
      for (let day = fromDay; day <= toDay; day++) {
        const { left, groups } = leftFor(post, day);
        const groupsSum = groups.reduce((s, g) => s + Math.max(0, g.remaining), 0);
        groups.forEach((g) => {
          for (let k = g.remaining; k > 0; k--) if (!pickFor(post, day, DOC_ROLE, g.specialties)) unfilled++;
        });
        ROLES.forEach((role) => {
          const k0 = (left[role] || 0) - (role === DOC_ROLE ? groupsSum : 0);
          for (let k = k0; k > 0; k--) if (!pickFor(post, day, role, null)) unfilled++;
        });
      }
    });
    // пас 2: місця «будь-хто»
    dayByDayPosts.forEach((post) => {
      for (let day = fromDay; day <= toDay; day++) {
        const { left } = leftFor(post, day);
        for (let k = left[ANY]; k > 0; k--) if (!pickFor(post, day, null, null)) unfilled++;
      }
    });

    setSchedule((prev) => ({ ...prev, [ym]: sched }));
    const rangeNote = fromDay > 1 || toDay < days ? ` (дні ${fromDay}–${toDay})` : "";
    notify(unfilled ? `Готово${rangeNote}, але ${unfilled} змін не закрито — бракує людей` : `Графік заповнено${rangeNote}`);
  };

  const clearMonth = () => {
    const fromDay = autoFromClamped;
    const toDay = Math.min(days, fromDay + autoDaysClamped - 1);
    const wholeMonth = fromDay === 1 && toDay === days;
    const question = wholeMonth
      ? "Очистити всі чергування за цей місяць?"
      : `Очистити чергування з ${fromDay} по ${toDay} число?`;
    if (!confirm(question)) return;
    setSchedule((prev) => {
      if (wholeMonth) return { ...prev, [ym]: {} };
      const m = { ...(prev[ym] || {}) };
      Object.keys(m).forEach((personId) => {
        const row = { ...m[personId] };
        for (let d = fromDay; d <= toDay; d++) delete row[d];
        m[personId] = row;
      });
      return { ...prev, [ym]: m };
    });
  };

  /* ── експорт CSV ── */
  const exportCsv = () => {
    const head = ["ПІБ", "Звання", "Категорія", ...Array.from({ length: days }, (_, i) => i + 1), "Всього"];
    const lines = [head.join(";")];
    ROLES.forEach((role) => {
      people.filter((p) => p.role === role).forEach((p) => {
        const row = [p.name, p.rank || "", p.role];
        for (let d = 1; d <= days; d++) {
          const pid = (monthSched[p.id] || {})[d];
          row.push(pid ? (postById[pid]?.short || pid) : "");
        }
        row.push(dutyCount(p.id));
        lines.push(row.join(";"));
      });
    });
    lines.push("");
    lines.push("Умовні позначення:;" + posts.map((p) => `${p.short} — ${p.name}`).join("; "));
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const [y, m] = ym.split("-");
    a.download = `график_чергувань_${m}_${y}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  /* ── експорт кольорового Excel (.xlsx), відтворює вигляд таблиці з програми ── */
  const exportExcel = async () => {
    if (typeof ExcelJS === "undefined") { notify("Не вдалося завантажити модуль Excel — перевір інтернет-з'єднання"); return; }
    const [yy, mm] = ym.split("-").map(Number);
    const dayCols = Array.from({ length: days }, (_, i) => i + 1);
    const lastCol = 1 + dayCols.length + 1; // ПІБ + дні + Σ
    const fill = (hex) => ({ type: "pattern", pattern: "solid", fgColor: { argb: "FF" + hex.replace("#", "").toUpperCase() } });
    const thin = { style: "thin", color: { argb: "FFBFBFBF" } };
    const border = { top: thin, left: thin, bottom: thin, right: thin };
    const boxRow = (row) => row.eachCell({ includeEmpty: true }, (cell, col) => { if (col <= lastCol) cell.border = border; });

    try {
      const wb = new ExcelJS.Workbook();
      wb.creator = "Медграфік";
      wb.created = new Date();
      const ws = wb.addWorksheet(`${MONTHS[mm - 1]} ${yy}`.slice(0, 31), { views: [{ state: "frozen", xSplit: 1, ySplit: 2 }] });

      ws.mergeCells(1, 1, 1, lastCol);
      const title = ws.getCell(1, 1);
      title.value = `Графік чергувань — ${MONTHS[mm - 1]} ${yy}`;
      title.font = { bold: true, size: 14 };
      ws.getRow(1).height = 22;

      const headerRow = ws.getRow(2);
      headerRow.getCell(1).value = "ПІБ / звання";
      dayCols.forEach((d, i) => {
        const w = wdOf(ym, d);
        const weekend = w === 0 || w === 6;
        const cell = headerRow.getCell(2 + i);
        cell.value = `${d}\n${WD[w]}`;
        cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        cell.font = { bold: true, color: { argb: weekend ? "FFB35C00" : "FF222222" } };
      });
      headerRow.getCell(lastCol).value = "Σ";
      headerRow.eachCell({ includeEmpty: true }, (cell, col) => {
        if (col > lastCol) return;
        cell.fill = fill("f1efe6");
        if (!cell.font) cell.font = { bold: true };
        if (!cell.alignment) cell.alignment = { horizontal: "center", vertical: "middle" };
      });
      headerRow.getCell(1).alignment = { horizontal: "left", vertical: "middle" };
      headerRow.height = 24;
      boxRow(headerRow);

      let r = 3;
      const active = people.filter((p) => p.active !== false);

      ROLES.forEach((role) => {
        const group = active.filter((p) => p.role === role);
        if (!group.length) return;
        ws.mergeCells(r, 1, r, lastCol);
        const gCell = ws.getCell(r, 1);
        gCell.value = `${role} — ${group.length}`;
        gCell.font = { bold: true, size: 10, color: { argb: "FF555C4A" } };
        gCell.fill = fill("e4e2d6");
        r++;

        group.forEach((p) => {
          const row = ws.getRow(r);
          const nameCell = row.getCell(1);
          nameCell.value = p.rank ? `${p.name}\n${p.rank}` : p.name;
          nameCell.alignment = { wrapText: true, vertical: "middle" };
          nameCell.font = { bold: true };
          dayCols.forEach((d, i) => {
            const pid = (monthSched[p.id] || {})[d];
            const post = pid ? postById[pid] : null;
            const cell = row.getCell(2 + i);
            cell.alignment = { horizontal: "center", vertical: "middle" };
            if (post) {
              cell.value = post.short;
              cell.fill = fill(post.color);
              cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
            }
          });
          const sumCell = row.getCell(lastCol);
          sumCell.value = dutyCount(p.id) || "";
          sumCell.font = { bold: true };
          sumCell.alignment = { horizontal: "center", vertical: "middle" };
          boxRow(row);
          row.height = 28;
          r++;
        });
      });

      ws.mergeCells(r, 1, r, lastCol);
      const covHeader = ws.getCell(r, 1);
      covHeader.value = "Покриття постів (є / треба)";
      covHeader.font = { bold: true, size: 10, color: { argb: "FF555C4A" } };
      covHeader.fill = fill("e4e2d6");
      r++;

      posts.forEach((post) => {
        const row = ws.getRow(r);
        const nameCell = row.getCell(1);
        nameCell.value = `${post.name}\n${reqText(post)}`;
        nameCell.alignment = { wrapText: true, vertical: "middle" };
        nameCell.fill = fill(post.color);
        nameCell.font = { bold: true, color: { argb: "FFFFFFFF" } };
        dayCols.forEach((d, i) => {
          const c = coverage[post.id]?.[d] || { have: 0, need: totalReq(post), missing: [] };
          const ok = !c.missing.length;
          const cell = row.getCell(2 + i);
          cell.value = `${c.have}/${c.need}`;
          cell.alignment = { horizontal: "center", vertical: "middle" };
          if (!ok) {
            cell.fill = fill("c0392b");
            cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
          } else {
            cell.font = { color: { argb: "FF3F7A2F" } };
          }
        });
        boxRow(row);
        row.height = 26;
        r++;
      });

      r++;
      ws.mergeCells(r, 1, r, lastCol);
      const legendCell = ws.getCell(r, 1);
      legendCell.value = "Умовні позначення: " + posts.map((p) => `${p.short} — ${p.name} (${reqText(p)})`).join("; ") + ".";
      legendCell.font = { italic: true, size: 9, color: { argb: "FF555C4A" } };
      legendCell.alignment = { wrapText: true };

      ws.getColumn(1).width = 26;
      dayCols.forEach((d, i) => { ws.getColumn(2 + i).width = 4.5; });
      ws.getColumn(lastCol).width = 6;

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const [y2, m2] = ym.split("-");
      a.download = `график_чергувань_${m2}_${y2}.xlsx`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      notify("Excel-файл сформовано");
    } catch (e) {
      console.error("Не вдалося сформувати Excel", e);
      notify("Не вдалося сформувати Excel-файл");
    }
  };

  const loadDemo = () => {
    setPeople(DEMO_PEOPLE.map((p) => ({ ...p, id: uid(), active: true })));
    notify("Додано приклад особового складу — відредагуй під свій підрозділ");
  };

  /* ── експорт/імпорт усіх даних (передача між пристроями) ── */
  const exportData = () => {
    const blob = new Blob([JSON.stringify({ people, posts, schedule, restDays }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `medgrafik_${ym}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };

  const importData = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.people)) throw new Error("bad format");
        if (people.length && !confirm("Замінити поточні дані даними з файлу?")) return;
        setPeople(d.people);
        setPosts((d.posts || DEFAULT_POSTS).map(migratePost));
        setSchedule(d.schedule || {});
        if (d.restDays != null) setRestDays(d.restDays);
        notify("Дані завантажено з файлу");
      } catch (e) { notify("Не вдалося прочитати файл — це не файл даних медграфіка"); }
    };
    r.readAsText(file);
  };

  const [y, m] = ym.split("-").map(Number);

  /* ───────── Рендер ───────── */
  return (
    <div className="min-h-screen" style={{ background: "#10130e", color: "#e8e6dd", fontFamily: "system-ui, sans-serif" }}>
      <style>{`
        .print-only { display: none; }
        @media print {
          @page { size: A4 landscape; margin: 8mm; }
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          body, .print-root { background: #fff !important; color: #000 !important; }
          #root > div { background: #fff !important; min-height: 0 !important; }
          .print-root { padding: 0 !important; }
          .grid-wrap { overflow: visible !important; max-height: none !important; border: none !important; border-radius: 0 !important; }
          .grid-wrap table { width: 100% !important; }
          .grid-wrap th, .grid-wrap td {
            position: static !important;
            background: #fff !important;
            color: #000 !important;
            border: 0.5pt solid #000 !important;
            box-shadow: none !important;
            font-size: 7.5px !important;
            height: auto !important;
            padding: 1px 2px !important;
            min-width: 0 !important;
          }
          .grid-wrap th, .grid-wrap td { line-height: 1.15 !important; }
          .grid-wrap th div, .grid-wrap td div { color: #000 !important; }
          .grid-wrap th div + div, .grid-wrap td div + div { font-size: 6px !important; }
          .grid-wrap .print-group { background: #e0e0e0 !important; padding: 0 2px !important; }
          /* Кольоровий друк — клітинки з нарядами й нестачею зберігають кольори, як у програмі */
          .grid-wrap td.cell.pcolor, .grid-wrap td.covcell.pcolor {
            background: var(--pcolor) !important;
            color: #fff !important;
            border-color: #555 !important;
          }
          .legend-swatch {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 3px;
            border: 0.5pt solid #000;
            vertical-align: middle;
          }
          .legend-swatch.pcolor { background: var(--pcolor) !important; border-color: #555 !important; }
        }
        .cell:hover { outline: 2px solid #e8e6dd55; outline-offset: -2px; }
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-thumb { background: #3a4032; border-radius: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
      `}</style>

      {/* Шапка */}
      <header className="px-4 pt-4 pb-3 no-print" style={{ borderBottom: "1px solid #2a2f24" }}>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="text-xs tracking-widest" style={{ color: "#8a9070" }}>МЕДИЧНА РОТА · ГРАФІК ЧЕРГУВАНЬ</div>
            <div className="flex items-center gap-3 mt-1">
              <button onClick={() => setYm(shiftYm(ym, -1))} className="px-2 py-1 rounded" style={{ background: "#1d2218" }}>‹</button>
              <h1 className="text-xl font-bold" style={{ minWidth: "11rem", textAlign: "center" }}>{MONTHS[m - 1]} {y}</h1>
              <button onClick={() => setYm(shiftYm(ym, 1))} className="px-2 py-1 rounded" style={{ background: "#1d2218" }}>›</button>
            </div>
          </div>
          <nav className="flex flex-wrap gap-1">
            {[["grid", "Графік"], ["people", "Особовий склад"], ["posts", "Пости"], ["summary", "Підсумки"]].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)}
                className="px-3 py-2 rounded-lg text-sm font-medium whitespace-nowrap"
                style={tab === id ? { background: "#e8e6dd", color: "#10130e" } : { background: "#1d2218", color: "#c9c7ba" }}>
                {label}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="p-4 print-root">
        {!loaded ? (
          <div className="text-center py-16" style={{ color: "#8a9070" }}>Завантаження…</div>
        ) : tab === "grid" ? (
          <GridTab {...{ people, posts, monthSched, days, ym, tool, setTool, cellClick, restConflict, coverage, dutyCount, autoFill, clearMonth, exportCsv, exportExcel, postById, isToday, loadDemo, restDays, setRestDays, colorPrint, setColorPrint, autoFrom: autoFromClamped, setAutoFrom, autoDays: autoDaysClamped, setAutoDays, filterDay, setFilterDay, exportData, importData }} />
        ) : tab === "people" ? (
          <PeopleTab {...{ people, setPeople, posts, loadDemo }} />
        ) : tab === "posts" ? (
          <PostsTab {...{ posts, setPosts }} />
        ) : (
          <SummaryTab {...{ people, posts, monthSched, dutyCount }} />
        )}
      </main>

      {toast && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm no-print"
          style={{ background: "#e8e6dd", color: "#10130e", boxShadow: "0 4px 20px #0008" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ───────── Вкладка: Графік ───────── */

function ImportButton({ onFile, label, className, style }) {
  const ref = useRef(null);
  return (
    <>
      <input ref={ref} type="file" accept=".json,application/json" style={{ display: "none" }}
        onChange={(e) => { const f = e.target.files[0]; if (f) onFile(f); e.target.value = ""; }} />
      <button onClick={() => ref.current.click()} className={className} style={style}>{label}</button>
    </>
  );
}

function GridTab({ people, posts, monthSched, days, ym, tool, setTool, cellClick, restConflict, coverage, dutyCount, autoFill, clearMonth, exportCsv, exportExcel, postById, isToday, loadDemo, restDays, setRestDays, colorPrint, setColorPrint, autoFrom, setAutoFrom, autoDays, setAutoDays, filterDay, setFilterDay, exportData, importData }) {
  /* другорядні налаштування (авторозподіл, фільтри, експорт) — на вузькому екрані (телефон) згорнуті за
     замовчуванням, на ширшому одразу розгорнуті, бо там достатньо місця */
  const [toolsOpen, setToolsOpen] = useState(() => typeof window !== "undefined" && window.innerWidth >= 768);

  if (!people.length) {
    return (
      <div className="text-center py-16">
        <p className="mb-1 text-lg font-semibold">Список особового складу порожній</p>
        <p className="mb-5 text-sm" style={{ color: "#8a9070" }}>Додай людей на вкладці «Особовий склад», завантаж збережений файл даних або почни з прикладу.</p>
        <div className="flex justify-center gap-2">
          <button onClick={loadDemo} className="px-4 py-2 rounded-lg font-medium" style={{ background: "#4a6b2f", color: "#fff" }}>
            Додати приклад даних
          </button>
          <ImportButton onFile={importData} label="⤓ Завантажити з файлу"
            className="px-4 py-2 rounded-lg font-medium" style={{ background: "#1d2218", color: "#c9c7ba" }} />
        </div>
      </div>
    );
  }

  const sched = monthSched;
  const [py, pm] = ym.split("-").map(Number);

  return (
    <div>
      {/* Заголовок лише для друку */}
      <div className="print-only" style={{ marginBottom: "6px" }}>
        <div style={{ fontWeight: 700, fontSize: "14pt" }}>Графік чергувань — {MONTHS[pm - 1]} {py}</div>
      </div>
      {/* Панель інструментів: вибір поста — завжди на видноті */}
      <div className="flex flex-wrap items-center gap-2 mb-2 no-print">
        <span className="text-xs uppercase tracking-wider mr-1" style={{ color: "#8a9070" }}>Постав на:</span>
        {posts.map((p) => (
          <button key={p.id} onClick={() => setTool(p.id)}
            title={(p.tourDays || 1) > 1 ? `Зміна триває ${p.tourDays} дн. — клік заповнює весь період` : undefined}
            className="px-3 py-1.5 rounded-lg text-sm font-semibold"
            style={{
              background: tool === p.id ? p.color : "#1d2218",
              color: tool === p.id ? "#fff" : "#c9c7ba",
              border: `1px solid ${p.color}`,
            }}>
            {p.short} · {p.name}{(p.tourDays || 1) > 1 ? ` · ${p.tourDays}д` : ""}
          </button>
        ))}
        <button onClick={() => setTool("erase")}
          className="px-3 py-1.5 rounded-lg text-sm font-semibold"
          style={{ background: tool === "erase" ? "#e8e6dd" : "#1d2218", color: tool === "erase" ? "#10130e" : "#c9c7ba", border: "1px solid #555" }}>
          ✕ Стерти
        </button>
      </div>

      {/* Решта налаштувань, авторозподіл і експорт — на телефоні згорнуто, на ширшому екрані видно завжди */}
      <button onClick={() => setToolsOpen((v) => !v)}
        className="no-print mb-2 inline-block px-3 py-1.5 rounded-lg text-sm font-semibold"
        style={{ background: "#1d2218", color: "#c9c7ba", border: "1px solid #2a2f24" }}>
        {toolsOpen ? "▾" : "▸"} Ще налаштування, авторозподіл, друк і дані
      </button>
      {toolsOpen && (
        <div className="flex flex-wrap items-center gap-2 mb-3 no-print">
          <label className="text-xs flex items-center gap-1" title="Мінімум днів між нарядами на добові (24-год) пости — налаштовується на вкладці «Пости»" style={{ color: "#8a9070" }}>
            Відпочинок між нарядами:
            <select value={restDays} onChange={(e) => setRestDays(Number(e.target.value))}
              className="rounded px-1 py-1" style={{ background: "#1d2218", color: "#e8e6dd" }}>
              {[0, 1, 2, 3].map((n) => <option key={n} value={n}>{n} дн.</option>)}
            </select>
          </label>
          <label className="text-xs flex items-center gap-1" title="Сховати тих, хто не в наряді у це число" style={{ color: "#8a9070" }}>
            Хто в наряді:
            <select value={filterDay ?? ""} onChange={(e) => setFilterDay(e.target.value ? Number(e.target.value) : null)}
              className="rounded px-1 py-1" style={{ background: "#1d2218", color: "#e8e6dd" }}>
              <option value="">Всі</option>
              {Array.from({ length: days }, (_, i) => i + 1).map((d) => <option key={d} value={d}>{d} число</option>)}
            </select>
          </label>
          <label className="text-xs flex items-center gap-1" title="Діапазон днів для «Авторозподіл» і «Очистити»" style={{ color: "#8a9070" }}>
            Діапазон днів — з числа:
            <input type="number" min={1} max={days} value={autoFrom}
              onChange={(e) => setAutoFrom(Math.min(days, Math.max(1, Number(e.target.value) || 1)))}
              className="rounded px-1 py-1 text-center" style={{ width: "3.4rem", background: "#1d2218", color: "#e8e6dd" }} />
            на
            <input type="number" min={1} max={days} value={autoDays}
              onChange={(e) => setAutoDays(Math.min(days, Math.max(1, Number(e.target.value) || 1)))}
              className="rounded px-1 py-1 text-center" style={{ width: "3.6rem", background: "#1d2218", color: "#e8e6dd" }} />
            дн.
          </label>
          <button onClick={autoFill} className="px-3 py-1.5 rounded-lg text-sm font-semibold" style={{ background: "#4a6b2f", color: "#fff" }}>
            ⚙ Авторозподіл
          </button>
          <button onClick={exportCsv} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>CSV</button>
          <button onClick={exportExcel} title="Кольоровий, відформатований файл .xlsx — вигляд як у програмі"
            className="px-3 py-1.5 rounded-lg text-sm font-semibold" style={{ background: "#217346", color: "#fff" }}>⊞ Excel</button>
          <label className="text-xs flex items-center gap-1" title="Зберегти кольори постів на роздрукованій таблиці замість чорно-білого варіанту" style={{ color: "#8a9070" }}>
            <input type="checkbox" checked={colorPrint} onChange={(e) => setColorPrint(e.target.checked)} />
            Кольоровий друк
          </label>
          <button onClick={() => window.print()} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>Друк</button>
          <button onClick={exportData} title="Зберегти всі дані у файл — для передачі чи резервної копії"
            className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>⤒ Зберегти дані</button>
          <ImportButton onFile={importData} label="⤓ Завантажити дані"
            className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }} />
          <button onClick={clearMonth} title="Очищає той самий діапазон днів, що й авторозподіл"
            className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218", color: "#d08a7a" }}>
            {autoFrom === 1 && autoFrom + autoDays - 1 >= days ? "Очистити" : `Очистити з ${autoFrom}`}
          </button>
        </div>
      )}

      <p className="text-xs mb-2 no-print" style={{ color: "#8a9070" }}>
        Обери пост зверху і клацай по клітинках. Повторний клік — зняти. Для постів зі «зміною» довшою за день клік одразу заповнює весь її період.
        Помаранчева рамка — порушено відпочинок між нарядами на добовий пост.
        {filterDay && <span> Показано лише тих, хто в наряді {filterDay} числа — <button onClick={() => setFilterDay(null)} className="underline" style={{ color: "#c9c7ba" }}>показати всіх</button>.</span>}
      </p>

      {/* Сітка */}
      <div className="grid-wrap overflow-auto rounded-lg" style={{ border: "1px solid #2a2f24", maxHeight: "72vh" }}>
        <table style={{ borderCollapse: "collapse", fontSize: "12px" }}>
          <thead>
            <tr style={{ position: "sticky", top: 0, zIndex: 3, background: "#171b13" }}>
              <th className="px-2 py-1 text-left" style={{ position: "sticky", left: 0, background: "#171b13", minWidth: "13rem", zIndex: 4 }}>ПІБ / звання</th>
              {Array.from({ length: days }, (_, i) => i + 1).map((d) => {
                const w = wdOf(ym, d);
                const weekend = w === 0 || w === 6;
                return (
                  <th key={d} className="px-0.5 py-1 text-center" style={{
                    minWidth: "2rem",
                    color: weekend ? "#d0a060" : "#c9c7ba",
                    background: d === filterDay ? "#2f5a7a" : isToday(d) ? "#3a4032" : undefined,
                    boxShadow: d === filterDay ? "inset 0 0 0 2px #5fa8ff" : undefined,
                  }}>
                    <div>{d}</div>
                    <div style={{ fontSize: "9px", color: weekend ? "#d0a060" : "#777d68" }}>{WD[w]}</div>
                  </th>
                );
              })}
              <th className="px-2 py-1" style={{ minWidth: "3rem" }}>Σ</th>
            </tr>
          </thead>
          <tbody>
            {ROLES.map((role) => {
              const group = people
                .filter((p) => p.role === role && p.active !== false)
                .filter((p) => !filterDay || (sched[p.id] && sched[p.id][filterDay]));
              if (!group.length) return null;
              return [
                <tr key={role + "-h"}>
                  <td colSpan={days + 2} className="print-group px-2 py-1 text-xs font-bold uppercase tracking-wider"
                    style={{ background: "#1d2218", color: "#8a9070", position: "sticky", left: 0 }}>
                    {role} — {group.length}
                  </td>
                </tr>,
                ...group.map((p) => (
                  <tr key={p.id} style={{ borderTop: "1px solid #22271d" }}>
                    <td className="px-2 py-1 whitespace-nowrap" style={{ position: "sticky", left: 0, background: "#10130e", zIndex: 2 }}>
                      <div className="font-medium">{p.name}</div>
                      <div style={{ fontSize: "10px", color: "#777d68" }}>{p.rank}</div>
                    </td>
                    {Array.from({ length: days }, (_, i) => i + 1).map((d) => {
                      const pid = (sched[p.id] || {})[d];
                      const post = pid ? postById[pid] : null;
                      const conflict = pid && restConflict(sched, p.id, d, pid);
                      const w = wdOf(ym, d);
                      const weekend = w === 0 || w === 6;
                      return (
                        <td key={d} onClick={() => cellClick(p.id, d)}
                          className={"cell text-center cursor-pointer select-none" + (colorPrint && post ? " pcolor" : "")}
                          title={post ? `${post.name}${conflict ? " — порушено відпочинок" : ""}` : ""}
                          style={{
                            background: post ? post.color : weekend ? "#161a12" : "transparent",
                            color: "#fff",
                            fontWeight: 700,
                            fontSize: "10px",
                            height: "26px",
                            boxShadow: [
                              conflict ? "inset 0 0 0 2px #ff9933" : null,
                              d === filterDay ? "inset 0 0 0 2px #5fa8ff" : null,
                            ].filter(Boolean).join(", ") || undefined,
                            borderLeft: "1px solid #1c2017",
                            ...(colorPrint && post ? { "--pcolor": post.color } : null),
                          }}>
                          {post ? post.short : ""}
                        </td>
                      );
                    })}
                    <td className="text-center font-bold" style={{ color: "#c9c7ba" }}>{dutyCount(p.id) || ""}</td>
                  </tr>
                )),
              ];
            })}

            {/* Покриття постів */}
            <tr><td colSpan={days + 2} className="print-group px-2 py-1 text-xs font-bold uppercase tracking-wider"
              style={{ background: "#1d2218", color: "#8a9070", position: "sticky", left: 0 }}>Покриття постів (є / треба)</td></tr>
            {posts.map((post) => (
              <tr key={"cov-" + post.id} style={{ borderTop: "1px solid #22271d" }}>
                <td className="px-2 py-1 whitespace-nowrap font-medium" style={{ position: "sticky", left: 0, background: "#10130e", zIndex: 2 }}>
                  <span className="no-print inline-block w-2.5 h-2.5 rounded-sm mr-1.5" style={{ background: post.color }} />
                  {post.name}
                  <div style={{ fontSize: "9px", color: "#777d68", fontWeight: 400 }}>{reqText(post)}</div>
                </td>
                {Array.from({ length: days }, (_, i) => i + 1).map((d) => {
                  const c = coverage[post.id]?.[d] || { have: 0, need: totalReq(post), missing: [] };
                  const ok = !c.missing.length;
                  return (
                    <td key={d} className={"text-center covcell" + (colorPrint && !ok ? " pcolor" : "")} title={ok ? "" : `Бракує: ${c.missing.join(", ")}`} style={{
                      fontSize: "10px",
                      height: "22px",
                      color: ok ? "#7fa86a" : "#ff7a5c",
                      fontWeight: ok ? 400 : 700,
                      background: ok ? "transparent" : "#3a1c14",
                      boxShadow: d === filterDay ? "inset 0 0 0 2px #5fa8ff" : undefined,
                      borderLeft: "1px solid #1c2017",
                      ...(colorPrint && !ok ? { "--pcolor": "#c0392b" } : null),
                    }}>
                      {c.have}/{c.need}
                    </td>
                  );
                })}
                <td />
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Легенда лише для друку */}
      <div className="print-only" style={{ marginTop: "4px", fontSize: "7pt" }}>
        <div>
          Умовні позначення:{" "}
          {posts.map((p, i) => (
            <span key={p.id}>
              <span className={"legend-swatch" + (colorPrint ? " pcolor" : "")} style={colorPrint ? { "--pcolor": p.color } : null} />
              {p.short} — {p.name} ({reqText(p)}){i < posts.length - 1 ? "; " : "."}
            </span>
          ))}
        </div>
        <div style={{ marginTop: "8px" }}>Склав: ______________________ &nbsp;&nbsp;&nbsp; Дата: «____» ____________ {py} р.</div>
      </div>
    </div>
  );
}

/* ───────── Вкладка: Особовий склад ───────── */

function PeopleTab({ people, setPeople, posts, loadDemo }) {
  const [form, setForm] = useState({ name: "", rank: "", role: ROLES[0], posts: [] });

  const togglePost = (arr, id) => arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id];

  const add = () => {
    if (!form.name.trim()) return;
    setPeople((prev) => [...prev, { ...form, name: form.name.trim(), id: uid(), active: true }]);
    setForm({ name: "", rank: "", role: form.role, posts: form.posts });
  };

  const update = (id, patch) => setPeople((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const remove = (id) => { if (confirm("Видалити з усіх графіків?")) setPeople((prev) => prev.filter((p) => p.id !== id)); };

  return (
    <div className="max-w-4xl">
      {/* Форма */}
      <div className="rounded-lg p-3 mb-4 flex flex-wrap gap-2 items-end" style={{ background: "#171b13", border: "1px solid #2a2f24" }}>
        <label className="text-xs" style={{ color: "#8a9070" }}>ПІБ
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })}
            onKeyDown={(e) => e.key === "Enter" && add()}
            placeholder="Прізвище І.Б." className="block mt-1 px-2 py-1.5 rounded w-44"
            style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
        </label>
        <label className="text-xs" style={{ color: "#8a9070" }}>Звання
          <input value={form.rank} onChange={(e) => setForm({ ...form, rank: e.target.value })}
            placeholder="сержант" className="block mt-1 px-2 py-1.5 rounded w-32"
            style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
        </label>
        <label className="text-xs" style={{ color: "#8a9070" }}>Категорія
          <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}
            className="block mt-1 px-2 py-1.5 rounded" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }}>
            {ROLES.map((r) => <option key={r}>{r}</option>)}
          </select>
        </label>
        {form.role === DOC_ROLE && (
          <label className="text-xs" style={{ color: "#8a9070" }}>Спеціальність
            <select value={form.specialty || ""} onChange={(e) => setForm({ ...form, specialty: e.target.value })}
              className="block mt-1 px-2 py-1.5 rounded" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }}>
              <option value="">—</option>
              {SPECIALTIES.map((s) => <option key={s}>{s}</option>)}
            </select>
          </label>
        )}
        <div className="text-xs" style={{ color: "#8a9070" }}>Допущений до постів
          <div className="flex gap-1 mt-1 flex-wrap">
            {posts.map((p) => (
              <button key={p.id} onClick={() => setForm({ ...form, posts: togglePost(form.posts, p.id) })}
                className="px-2 py-1 rounded text-xs font-semibold"
                style={{
                  background: form.posts.includes(p.id) ? p.color : "#10130e",
                  color: form.posts.includes(p.id) ? "#fff" : "#777d68",
                  border: `1px solid ${form.posts.includes(p.id) ? p.color : "#2a2f24"}`,
                }}>
                {p.short}
              </button>
            ))}
          </div>
        </div>
        <button onClick={add} className="px-4 py-1.5 rounded-lg font-semibold" style={{ background: "#4a6b2f", color: "#fff" }}>+ Додати</button>
        {!people.length && (
          <button onClick={loadDemo} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>Приклад даних</button>
        )}
      </div>

      {/* Список */}
      {ROLES.map((role) => {
        const group = people.filter((p) => p.role === role);
        if (!group.length) return null;
        return (
          <div key={role} className="mb-4">
            <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#8a9070" }}>{role} — {group.length}</div>
            {group.map((p) => (
              <div key={p.id} className="flex flex-wrap items-center gap-2 px-3 py-2 rounded-lg mb-1"
                style={{ background: "#171b13", border: "1px solid #2a2f24", opacity: p.active === false ? 0.45 : 1 }}>
                <input value={p.name} onChange={(e) => update(p.id, { name: e.target.value })}
                  className="px-2 py-1 rounded w-44 font-medium" style={{ background: "transparent", border: "1px solid transparent", color: "#e8e6dd" }} />
                <input value={p.rank || ""} onChange={(e) => update(p.id, { rank: e.target.value })}
                  placeholder="звання" className="px-2 py-1 rounded w-32 text-sm" style={{ background: "transparent", border: "1px solid transparent", color: "#8a9070" }} />
                <select value={p.role} onChange={(e) => update(p.id, { role: e.target.value })}
                  className="px-2 py-1 rounded text-sm" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }}>
                  {ROLES.map((r) => <option key={r}>{r}</option>)}
                </select>
                {p.role === DOC_ROLE && (
                  <select value={p.specialty || ""} onChange={(e) => update(p.id, { specialty: e.target.value })}
                    title="Спеціальність лікаря" className="px-2 py-1 rounded text-sm" style={{ background: "#10130e", border: "1px solid #2a2f24", color: p.specialty ? "#e8e6dd" : "#777d68" }}>
                    <option value="">Спеціальність —</option>
                    {SPECIALTIES.map((s) => <option key={s}>{s}</option>)}
                  </select>
                )}
                <div className="flex gap-1">
                  {posts.map((post) => (
                    <button key={post.id} onClick={() => update(p.id, { posts: togglePost(p.posts, post.id) })}
                      title={post.name}
                      className="px-2 py-1 rounded text-xs font-semibold"
                      style={{
                        background: p.posts.includes(post.id) ? post.color : "#10130e",
                        color: p.posts.includes(post.id) ? "#fff" : "#555c4a",
                        border: `1px solid ${p.posts.includes(post.id) ? post.color : "#2a2f24"}`,
                      }}>
                      {post.short}
                    </button>
                  ))}
                </div>
                <div className="grow" />
                <button onClick={() => update(p.id, { active: p.active === false ? true : false })}
                  className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#c9c7ba" }}>
                  {p.active === false ? "Повернути" : "Відпустка/ВЛК"}
                </button>
                <button onClick={() => remove(p.id)} className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#d08a7a" }}>✕</button>
              </div>
            ))}
          </div>
        );
      })}
      {people.length > 0 && (
        <p className="text-xs" style={{ color: "#777d68" }}>
          «Відпустка/ВЛК» тимчасово виключає людину з графіка та авторозподілу, не видаляючи її.
        </p>
      )}
    </div>
  );
}

/* ───────── Вкладка: Пости ───────── */

function PostsTab({ posts, setPosts }) {
  const COLORS = ["#4a6b2f", "#2f6f9f", "#a8402f", "#2e8572", "#a87514", "#6b4a8a", "#8a6b2f", "#4a8a8a"];
  const update = (id, patch) => setPosts((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const add = () => setPosts((prev) => [...prev, { id: uid(), name: "Новий пост", short: "НП", color: COLORS[prev.length % COLORS.length], req: { [ANY]: 1 }, daily: true }]);
  const remove = (id) => { if (confirm("Видалити пост? Призначення на нього зникнуть з відображення.")) setPosts((prev) => prev.filter((p) => p.id !== id)); };

  const setReq = (p, key, value) => {
    const n = Math.max(0, Math.min(9, Number(value) || 0));
    const req = { ...normReq(p) };
    if (n === 0) delete req[key];
    else req[key] = n;
    update(p.id, { req });
  };

  const setDocGroups = (p, groups) => update(p.id, { docGroups: groups });
  const addDocGroup = (p) => setDocGroups(p, [...normDocGroups(p), { specialties: [], count: 1 }]);
  const removeDocGroup = (p, idx) => setDocGroups(p, normDocGroups(p).filter((_, i) => i !== idx));
  const toggleDocGroupSpecialty = (p, idx, spec) => {
    const groups = normDocGroups(p).map((g, i) => {
      if (i !== idx) return g;
      const has = g.specialties.includes(spec);
      return { ...g, specialties: has ? g.specialties.filter((s) => s !== spec) : [...g.specialties, spec] };
    });
    setDocGroups(p, groups);
  };
  const setDocGroupCount = (p, idx, value) => {
    const n = Math.max(0, Math.min(9, Number(value) || 0));
    setDocGroups(p, normDocGroups(p).map((g, i) => (i === idx ? { ...g, count: n } : g)));
  };

  return (
    <div className="max-w-4xl">
      <p className="text-sm mb-3" style={{ color: "#8a9070" }}>
        «Склад на добу» — скільки і кого має бути на посту щодня. «Будь-хто» — місця без вимоги до категорії.
        Це використовують авторозподіл і контроль покриття.
        «Добовий» — пост повного (24-год) чергування: авторозподіл і перевірка відпочинку (вкладка «Графік») враховують
        лише такі пости, щоб людина не йшла на добове чергування частіше, ніж дозволяє налаштований відпочинок.
        Якщо в складі є «Лікар», можна додати вимоги до спеціальності: кожна вимога — окрема кількість лікарів
        БУДЬ-ЯКОЇ з позначених у ній спеціальностей (напр. одна вимога «Хірург + Травматолог + Анестезіолог, 1» —
        це один лікар будь-якої з трьох; а дві окремі вимоги «Хірург, 1» і «Терапевт, 1» — це вже і хірург,
        і терапевт одночасно). Спеціальність лікаря вказується на вкладці «Особовий склад».
        Лікарські місця понад усі вимоги — будь-якої спеціальності.
        «Зміна, дн.» — на скільки днів поспіль ставиться одна й та сама людина, перш ніж заміна (наприклад, тиждень
        чи два тижні); авторозподіл і клік на клітинці графіка заповнюють увесь цей період одразу.
      </p>
      {posts.map((p) => {
        const req = normReq(p);
        return (
        <div key={p.id} className="flex flex-wrap items-center gap-2 px-3 py-2 rounded-lg mb-1"
          style={{ background: "#171b13", border: "1px solid #2a2f24" }}>
          <input value={p.name} onChange={(e) => update(p.id, { name: e.target.value })}
            className="px-2 py-1 rounded w-44 font-medium" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
          <label className="text-xs" style={{ color: "#8a9070" }}>Код
            <input value={p.short} maxLength={3} onChange={(e) => update(p.id, { short: e.target.value.toUpperCase() })}
              className="ml-1 px-2 py-1 rounded w-14 text-center font-bold" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
          </label>
          <div className="flex gap-1">
            {COLORS.map((c) => (
              <button key={c} onClick={() => update(p.id, { color: c })}
                className="w-6 h-6 rounded"
                style={{ background: c, outline: p.color === c ? "2px solid #e8e6dd" : "none", outlineOffset: "1px" }} />
            ))}
          </div>
          <label className="text-xs flex items-center gap-1 px-2 py-1 rounded"
            title="Пост повної доби (24 год) — авторозподіл та перевірка відпочинку враховують лише добові пости"
            style={{ color: p.daily !== false ? "#e8e6dd" : "#555c4a", border: `1px solid ${p.daily !== false ? p.color : "#2a2f24"}` }}>
            <input type="checkbox" checked={p.daily !== false} onChange={(e) => update(p.id, { daily: e.target.checked })} />
            Добовий
          </label>
          <label className="text-xs flex items-center gap-1"
            title="Скільки днів поспіль на посту одна й та сама людина, перш ніж заміна. 1 — змінюються щодня."
            style={{ color: (p.tourDays || 1) > 1 ? "#e8e6dd" : "#8a9070" }}>
            Зміна, дн.
            <input type="number" min={1} max={60} value={p.tourDays || 1}
              onChange={(e) => update(p.id, { tourDays: Math.max(1, Math.min(60, Number(e.target.value) || 1)) })}
              className="px-1 py-0.5 rounded w-12 text-center"
              style={{
                background: "#10130e",
                border: `1px solid ${(p.tourDays || 1) > 1 ? p.color : "#2a2f24"}`,
                color: (p.tourDays || 1) > 1 ? "#e8e6dd" : "#555c4a",
                fontWeight: (p.tourDays || 1) > 1 ? 700 : 400,
              }} />
          </label>
          <div className="flex gap-1">
            {[["Щодня", 1], ["Тиждень", 7], ["2 тижні", 14]].map(([label, n]) => (
              <button key={label} onClick={() => update(p.id, { tourDays: n })}
                className="px-2 py-1 rounded text-xs font-semibold"
                style={{
                  background: (p.tourDays || 1) === n ? p.color : "#10130e",
                  color: (p.tourDays || 1) === n ? "#fff" : "#777d68",
                  border: `1px solid ${(p.tourDays || 1) === n ? p.color : "#2a2f24"}`,
                }}>
                {label}
              </button>
            ))}
          </div>
          <div className="grow" />
          <span className="text-xs font-semibold" style={{ color: "#c9c7ba" }}>Разом: {totalReq(p)}</span>
          <button onClick={() => remove(p.id)} className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#d08a7a" }}>✕</button>
          <div className="w-full flex flex-wrap items-center gap-x-3 gap-y-1 pt-1" style={{ borderTop: "1px solid #22271d" }}>
            <span className="text-xs uppercase tracking-wider" style={{ color: "#8a9070" }}>Склад на добу:</span>
            {[ANY, ...ROLES].map((key) => {
              const n = req[key] || 0;
              return (
                <label key={key} className="text-xs flex items-center gap-1" style={{ color: n > 0 ? "#e8e6dd" : "#555c4a" }}>
                  {reqLabel(key)}
                  <input type="number" min={0} max={9} value={n}
                    onChange={(e) => setReq(p, key, e.target.value)}
                    className="px-1 py-0.5 rounded w-11 text-center"
                    style={{
                      background: "#10130e",
                      border: `1px solid ${n > 0 ? p.color : "#2a2f24"}`,
                      color: n > 0 ? "#e8e6dd" : "#555c4a",
                      fontWeight: n > 0 ? 700 : 400,
                    }} />
                </label>
              );
            })}
          </div>
          {(req[DOC_ROLE] || 0) > 0 && (() => {
            const groups = normDocGroups(p);
            const groupsSum = groups.reduce((s, g) => s + (Number(g.count) || 0), 0);
            const rest = req[DOC_ROLE] - groupsSum;
            return (
              <div className="w-full pt-1" style={{ borderTop: "1px solid #22271d" }}>
                <div className="text-xs uppercase tracking-wider mb-1" style={{ color: "#8a9070" }}>
                  Вимоги до лікарів (з {req[DOC_ROLE]}):
                </div>
                {groups.map((g, gi) => (
                  <div key={gi} className="flex flex-wrap items-center gap-1 mb-1 pl-2" style={{ borderLeft: `2px solid ${p.color}` }}>
                    {SPECIALTIES.map((s) => (
                      <button key={s} onClick={() => toggleDocGroupSpecialty(p, gi, s)}
                        className="px-2 py-1 rounded text-xs font-semibold"
                        style={{
                          background: g.specialties.includes(s) ? p.color : "#10130e",
                          color: g.specialties.includes(s) ? "#fff" : "#777d68",
                          border: `1px solid ${g.specialties.includes(s) ? p.color : "#2a2f24"}`,
                        }}>
                        {s}
                      </button>
                    ))}
                    <span className="text-xs" style={{ color: "#8a9070" }}>×</span>
                    <input type="number" min={0} max={9} value={g.count}
                      onChange={(e) => setDocGroupCount(p, gi, e.target.value)}
                      className="px-1 py-0.5 rounded w-11 text-center"
                      style={{ background: "#10130e", border: `1px solid ${p.color}`, color: "#e8e6dd", fontWeight: 700 }} />
                    <button onClick={() => removeDocGroup(p, gi)} className="px-1.5 py-0.5 rounded text-xs" style={{ background: "#1d2218", color: "#d08a7a" }}>✕</button>
                  </div>
                ))}
                <div className="flex flex-wrap items-center gap-3">
                  <button onClick={() => addDocGroup(p)} className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#c9c7ba" }}>
                    + Додати вимогу до спеціальності
                  </button>
                  <span className="text-xs" style={{ color: rest < 0 ? "#ff9a7c" : "#8a9070" }}>
                    {groupsSum === 0
                      ? "Без обмежень — будь-який лікар"
                      : rest > 0
                      ? `+ ${rest} будь-якої спеціальності`
                      : rest < 0
                      ? `забагато на ${-rest} — перевищує кількість лікарів на посту`
                      : "розподілено повністю"}
                  </span>
                </div>
              </div>
            );
          })()}
        </div>
        );
      })}
      <button onClick={add} className="mt-2 px-4 py-1.5 rounded-lg font-semibold" style={{ background: "#4a6b2f", color: "#fff" }}>+ Додати пост</button>
    </div>
  );
}

/* ───────── Вкладка: Підсумки ───────── */

function SummaryTab({ people, posts, monthSched, dutyCount }) {
  const byPost = (personId) => {
    const res = {};
    Object.values(monthSched[personId] || {}).forEach((pid) => { res[pid] = (res[pid] || 0) + 1; });
    return res;
  };

  const active = people.filter((p) => p.active !== false);
  const counts = active.map((p) => dutyCount(p.id));
  const max = Math.max(1, ...counts);

  return (
    <div className="max-w-3xl">
      {/* Навантаження */}
      <h2 className="font-bold mb-2">Навантаження за місяць</h2>
      <div className="rounded-lg p-3" style={{ background: "#171b13", border: "1px solid #2a2f24" }}>
        {ROLES.map((role) => {
          const group = active.filter((p) => p.role === role);
          if (!group.length) return null;
          return (
            <div key={role} className="mb-3">
              <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#8a9070" }}>{role}</div>
              {group.sort((a, b) => dutyCount(b.id) - dutyCount(a.id)).map((p) => {
                const n = dutyCount(p.id);
                const parts = byPost(p.id);
                return (
                  <div key={p.id} className="flex items-center gap-2 mb-1 text-sm">
                    <div className="w-40 truncate">{p.name}</div>
                    <div className="grow h-4 rounded overflow-hidden flex" style={{ background: "#10130e" }}>
                      {posts.map((post) => {
                        const k = parts[post.id] || 0;
                        if (!k) return null;
                        return <div key={post.id} title={`${post.name}: ${k}`} style={{ width: `${(k / max) * 100}%`, background: post.color }} />;
                      })}
                    </div>
                    <div className="w-8 text-right font-bold">{n}</div>
                  </div>
                );
              })}
            </div>
          );
        })}
        <div className="flex flex-wrap gap-3 mt-2 pt-2 text-xs" style={{ borderTop: "1px solid #2a2f24", color: "#8a9070" }}>
          {posts.map((p) => (
            <span key={p.id}><span className="inline-block w-2.5 h-2.5 rounded-sm mr-1" style={{ background: p.color }} />{p.name}</span>
          ))}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<DutyRoster />);

</script>
