<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Медрота — графік чергувань</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;background:#10130e}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ───────── Довідники ───────── */

const ROLES = ["Управління", "Лікар", "Фельдшер", "Медсестра/брат", "Статист", "Аптека", "Водій", "Санітар", "Кухар", "Інше"];

const ANY = "any"; // місце без вимоги до категорії

const DEFAULT_POSTS = [
  { id: "stab",   name: "Стабпункт",    short: "СТ", color: "#4a6b2f", req: { [ANY]: 2 } },
  { id: "amb",    name: "Амбулаторія",  short: "АМ", color: "#2f6f9f", req: { [ANY]: 1 } },
  { id: "travma", name: "Травмпункт",   short: "ТР", color: "#a8402f", req: { "Лікар": 1, "Фельдшер": 1, "Санітар": 1 } },
  { id: "stac",   name: "Стаціонар",    short: "СЦ", color: "#2e8572", req: { [ANY]: 2 } },
  { id: "kuhnya", name: "Кухня",        short: "КХ", color: "#a87514", req: { "Кухар": 1 } },
];

const WD = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const MONTHS = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];

const DEMO_PEOPLE = [
  { name: "Коваленко О.В.", rank: "майор м/с",  role: "Лікар",          posts: ["stab","travma","stac"] },
  { name: "Шевченко І.М.",  rank: "капітан м/с", role: "Лікар",          posts: ["amb","stac"] },
  { name: "Бондаренко Т.С.",rank: "ст. лейтенант м/с", role: "Лікар",   posts: ["travma","stab"] },
  { name: "Мельник В.П.",   rank: "ст. сержант", role: "Фельдшер",       posts: ["stab","travma","amb"] },
  { name: "Ткаченко Д.О.",  rank: "сержант",     role: "Фельдшер",       posts: ["stab","stac"] },
  { name: "Кравченко Ю.А.", rank: "солдат",      role: "Фельдшер",       posts: ["amb","travma"] },
  { name: "Олійник Н.І.",   rank: "сержант",     role: "Медсестра/брат", posts: ["stac"] },
  { name: "Поліщук С.В.",   rank: "солдат",      role: "Медсестра/брат", posts: ["stac","amb"] },
  { name: "Лисенко А.Р.",   rank: "ст. солдат",  role: "Водій",          posts: ["stab","travma"] },
  { name: "Савченко М.М.",  rank: "солдат",      role: "Водій",          posts: ["stab"] },
  { name: "Руденко П.Г.",   rank: "солдат",      role: "Санітар",        posts: ["stac","travma"] },
  { name: "Марченко К.Л.",  rank: "солдат",      role: "Санітар",        posts: ["stac","stab","travma"] },
  { name: "Гриценко В.Д.",  rank: "солдат",      role: "Кухар",          posts: ["kuhnya"] },
  { name: "Захарченко О.О.",rank: "солдат",      role: "Кухар",          posts: ["kuhnya"] },
];

/* ───────── Утиліти ───────── */

const uid = () => Math.random().toString(36).slice(2, 10);
const pad2 = (n) => String(n).padStart(2, "0");
const ymOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const wdOf = (ym, day) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, day).getDay(); };
const shiftYm = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return ymOf(d); };

/* вимоги поста: {категорія|any: кількість}; старі дані мали лише slots */
const normReq = (post) => (post.req && typeof post.req === "object" ? post.req : { [ANY]: post.slots || 1 });
const totalReq = (post) => Object.values(normReq(post)).reduce((s, n) => s + (Number(n) || 0), 0);
const reqLabel = (key) => (key === ANY ? "Будь-хто" : key);
const reqText = (post) =>
  Object.entries(normReq(post)).filter(([, n]) => n > 0).map(([k, n]) => `${n} ${reqLabel(k)}`).join(" · ");

/* скільки і кого бракує на посту в конкретний день */
const evalCoverage = (post, assigned) => {
  const left = { ...normReq(post) };
  let extra = 0;
  assigned.forEach((p) => {
    if (left[p.role] > 0) left[p.role]--;
    else extra++; // зайві за категорією йдуть у місця «будь-хто»
  });
  const anyShort = Math.max(0, (left[ANY] || 0) - extra);
  const missing = [];
  ROLES.forEach((r) => { if (left[r] > 0) missing.push(`${left[r]} ${r}`); });
  if (anyShort > 0) missing.push(`${anyShort} будь-хто`);
  return { have: assigned.length, need: totalReq(post), missing };
};

const STORAGE_KEY = "medrota-duty-v1";

/* ───────── Головний компонент ───────── */

function DutyRoster() {
  const today = new Date();
  const [tab, setTab] = useState("grid");
  const [ym, setYm] = useState(ymOf(today));
  const [people, setPeople] = useState([]);
  const [posts, setPosts] = useState(DEFAULT_POSTS);
  const [schedule, setSchedule] = useState({}); // {ym: {personId: {day: postId}}}
  const [restDays, setRestDays] = useState(2);
  const [tool, setTool] = useState(DEFAULT_POSTS[0].id); // обраний пост або "erase"
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);
  const isCurrentMonth = ym === ymOf(today);
  const [autoFrom, setAutoFrom] = useState(isCurrentMonth ? today.getDate() : 1);
  const [autoDays, setAutoDays] = useState(daysIn(ym) - (isCurrentMonth ? today.getDate() - 1 : 0));
  const [filterDay, setFilterDay] = useState(null); // показати лише тих, хто в наряді у це число
  const prevYmRef = useRef(ym);

  /* завантаження */
  useEffect(() => {
    try {
      const r = localStorage.getItem(STORAGE_KEY);
      if (r) {
        const d = JSON.parse(r);
        if (d.people) setPeople(d.people);
        if (d.posts) setPosts(d.posts.map((p) => (p.req ? p : { ...p, req: { [ANY]: p.slots || 1 } })));
        if (d.schedule) setSchedule(d.schedule);
        if (d.restDays != null) setRestDays(d.restDays);
        if (d.autoFrom != null) setAutoFrom(d.autoFrom);
        if (d.autoDays != null) setAutoDays(d.autoDays);
      }
    } catch (e) { /* перший запуск — даних ще немає */ }
    setLoaded(true);
  }, []);

  /* збереження з затримкою */
  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ people, posts, schedule, restDays, autoFrom, autoDays }));
      } catch (e) { console.error("Не вдалося зберегти", e); }
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [people, posts, schedule, restDays, autoFrom, autoDays, loaded]);

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const days = daysIn(ym);
  /* при переході на інший місяць (а не при першому завантаженні сторінки,
     щоб не затерти збережений користувачем вибір) пропонуємо нові значення за замовчуванням */
  useEffect(() => {
    if (prevYmRef.current === ym) return;
    prevYmRef.current = ym;
    const t = new Date();
    const start = ymOf(t) === ym ? t.getDate() : 1;
    setAutoFrom(start);
    setAutoDays(daysIn(ym) - start + 1);
    setFilterDay(null);
  }, [ym]);
  const autoFromClamped = Math.min(Math.max(1, autoFrom || 1), days);
  const autoDaysClamped = Math.min(Math.max(1, autoDays || 1), days - autoFromClamped + 1);
  const monthSched = schedule[ym] || {};
  const postById = useMemo(() => Object.fromEntries(posts.map((p) => [p.id, p])), [posts]);

  const isToday = (day) => {
    const t = new Date();
    return ymOf(t) === ym && t.getDate() === day;
  };

  /* ── редагування клітинки ── */
  const setCell = (personId, day, postId) => {
    setSchedule((prev) => {
      const m = { ...(prev[ym] || {}) };
      const row = { ...(m[personId] || {}) };
      if (postId === null || row[day] === postId) delete row[day];
      else row[day] = postId;
      m[personId] = row;
      return { ...prev, [ym]: m };
    });
  };

  const cellClick = (personId, day) => {
    if (tool === "erase") setCell(personId, day, null);
    else setCell(personId, day, tool);
  };

  /* ── перевірки ── */
  const hasDuty = (sched, personId, day) => !!(sched[personId] && sched[personId][day]);

  const restConflict = (sched, personId, day) => {
    for (let k = 1; k <= restDays; k++) {
      if (day - k >= 1 && hasDuty(sched, personId, day - k)) return true;
      if (day + k <= days && hasDuty(sched, personId, day + k)) return true;
    }
    return false;
  };

  const coverage = useMemo(() => {
    // {postId: {day: {have, need, missing}}}
    const byDay = {}; // {postId: {day: [people]}}
    posts.forEach((p) => { byDay[p.id] = {}; });
    people.forEach((p) => {
      const row = monthSched[p.id] || {};
      Object.entries(row).forEach(([d, pid]) => {
        if (byDay[pid]) (byDay[pid][d] = byDay[pid][d] || []).push(p);
      });
    });
    const cov = {};
    posts.forEach((post) => {
      cov[post.id] = {};
      for (let d = 1; d <= days; d++) cov[post.id][d] = evalCoverage(post, byDay[post.id][d] || []);
    });
    return cov;
  }, [monthSched, posts, people, days]);

  const dutyCount = (personId) => Object.keys(monthSched[personId] || {}).length;

  /* ── авторозподіл ── */
  const autoFill = () => {
    const fromDay = autoFromClamped;
    const toDay = Math.min(days, fromDay + autoDaysClamped - 1);
    const sched = {};
    Object.entries(monthSched).forEach(([pid, row]) => { sched[pid] = { ...row }; });
    const counts = {};
    people.forEach((p) => { counts[p.id] = Object.keys(sched[p.id] || {}).length; });
    let unfilled = 0;

    const pickFor = (post, day, role) => {
      const cands = people
        .filter((p) => p.active !== false && p.posts.includes(post.id))
        .filter((p) => !role || p.role === role)
        .filter((p) => !hasDuty(sched, p.id, day))
        .filter((p) => !restConflict(sched, p.id, day))
        .sort((a, b) => counts[a.id] - counts[b.id] || a.name.localeCompare(b.name, "uk"));
      if (!cands.length) return false;
      const pick = cands[0];
      if (!sched[pick.id]) sched[pick.id] = {};
      sched[pick.id][day] = post.id;
      counts[pick.id]++;
      return true;
    };

    // скільки ще треба з урахуванням уже проставленого
    const leftFor = (post, day) => {
      const left = { ...normReq(post) };
      let extra = 0;
      people.forEach((p) => {
        if (sched[p.id] && sched[p.id][day] === post.id) {
          if (left[p.role] > 0) left[p.role]--;
          else extra++;
        }
      });
      left[ANY] = Math.max(0, (left[ANY] || 0) - extra);
      return left;
    };

    // пас 1: місця з вимогою категорії — фахівці дефіцитніші, їх ставимо першими
    posts.forEach((post) => {
      for (let day = fromDay; day <= toDay; day++) {
        const left = leftFor(post, day);
        ROLES.forEach((role) => {
          for (let k = left[role] || 0; k > 0; k--) if (!pickFor(post, day, role)) unfilled++;
        });
      }
    });
    // пас 2: місця «будь-хто»
    posts.forEach((post) => {
      for (let day = fromDay; day <= toDay; day++) {
        const left = leftFor(post, day);
        for (let k = left[ANY]; k > 0; k--) if (!pickFor(post, day, null)) unfilled++;
      }
    });

    setSchedule((prev) => ({ ...prev, [ym]: sched }));
    const rangeNote = fromDay > 1 || toDay < days ? ` (дні ${fromDay}–${toDay})` : "";
    notify(unfilled ? `Готово${rangeNote}, але ${unfilled} змін не закрито — бракує людей` : `Графік заповнено${rangeNote}`);
  };

  const clearMonth = () => {
    const fromDay = autoFromClamped;
    const toDay = Math.min(days, fromDay + autoDaysClamped - 1);
    const wholeMonth = fromDay === 1 && toDay === days;
    const question = wholeMonth
      ? "Очистити всі чергування за цей місяць?"
      : `Очистити чергування з ${fromDay} по ${toDay} число?`;
    if (!confirm(question)) return;
    setSchedule((prev) => {
      if (wholeMonth) return { ...prev, [ym]: {} };
      const m = { ...(prev[ym] || {}) };
      Object.keys(m).forEach((personId) => {
        const row = { ...m[personId] };
        for (let d = fromDay; d <= toDay; d++) delete row[d];
        m[personId] = row;
      });
      return { ...prev, [ym]: m };
    });
  };

  /* ── експорт CSV ── */
  const exportCsv = () => {
    const head = ["ПІБ", "Звання", "Категорія", ...Array.from({ length: days }, (_, i) => i + 1), "Всього"];
    const lines = [head.join(";")];
    ROLES.forEach((role) => {
      people.filter((p) => p.role === role).forEach((p) => {
        const row = [p.name, p.rank || "", p.role];
        for (let d = 1; d <= days; d++) {
          const pid = (monthSched[p.id] || {})[d];
          row.push(pid ? (postById[pid]?.short || pid) : "");
        }
        row.push(dutyCount(p.id));
        lines.push(row.join(";"));
      });
    });
    lines.push("");
    lines.push("Умовні позначення:;" + posts.map((p) => `${p.short} — ${p.name}`).join("; "));
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const [y, m] = ym.split("-");
    a.download = `график_чергувань_${m}_${y}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const loadDemo = () => {
    setPeople(DEMO_PEOPLE.map((p) => ({ ...p, id: uid(), active: true })));
    notify("Додано приклад особового складу — відредагуй під свій підрозділ");
  };

  /* ── експорт/імпорт усіх даних (передача між пристроями) ── */
  const exportData = () => {
    const blob = new Blob([JSON.stringify({ people, posts, schedule, restDays }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `medgrafik_${ym}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };

  const importData = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.people)) throw new Error("bad format");
        if (people.length && !confirm("Замінити поточні дані даними з файлу?")) return;
        setPeople(d.people);
        setPosts((d.posts || DEFAULT_POSTS).map((p) => (p.req ? p : { ...p, req: { [ANY]: p.slots || 1 } })));
        setSchedule(d.schedule || {});
        if (d.restDays != null) setRestDays(d.restDays);
        notify("Дані завантажено з файлу");
      } catch (e) { notify("Не вдалося прочитати файл — це не файл даних медграфіка"); }
    };
    r.readAsText(file);
  };

  const [y, m] = ym.split("-").map(Number);

  /* ───────── Рендер ───────── */
  return (
    <div className="min-h-screen" style={{ background: "#10130e", color: "#e8e6dd", fontFamily: "system-ui, sans-serif" }}>
      <style>{`
        .print-only { display: none; }
        @media print {
          @page { size: A4 landscape; margin: 8mm; }
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          body, .print-root { background: #fff !important; color: #000 !important; }
          #root > div { background: #fff !important; min-height: 0 !important; }
          .print-root { padding: 0 !important; }
          .grid-wrap { overflow: visible !important; max-height: none !important; border: none !important; border-radius: 0 !important; }
          .grid-wrap table { width: 100% !important; }
          .grid-wrap th, .grid-wrap td {
            position: static !important;
            background: #fff !important;
            color: #000 !important;
            border: 0.5pt solid #000 !important;
            box-shadow: none !important;
            font-size: 7.5px !important;
            height: auto !important;
            padding: 1px 2px !important;
            min-width: 0 !important;
          }
          .grid-wrap th, .grid-wrap td { line-height: 1.15 !important; }
          .grid-wrap th div, .grid-wrap td div { color: #000 !important; }
          .grid-wrap th div + div, .grid-wrap td div + div { font-size: 6px !important; }
          .grid-wrap .print-group { background: #e0e0e0 !important; padding: 0 2px !important; }
        }
        .cell:hover { outline: 2px solid #e8e6dd55; outline-offset: -2px; }
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-thumb { background: #3a4032; border-radius: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
      `}</style>

      {/* Шапка */}
      <header className="px-4 pt-4 pb-3 no-print" style={{ borderBottom: "1px solid #2a2f24" }}>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="text-xs tracking-widest" style={{ color: "#8a9070" }}>МЕДИЧНА РОТА · ГРАФІК ЧЕРГУВАНЬ</div>
            <div className="flex items-center gap-3 mt-1">
              <button onClick={() => setYm(shiftYm(ym, -1))} className="px-2 py-1 rounded" style={{ background: "#1d2218" }}>‹</button>
              <h1 className="text-xl font-bold" style={{ minWidth: "11rem", textAlign: "center" }}>{MONTHS[m - 1]} {y}</h1>
              <button onClick={() => setYm(shiftYm(ym, 1))} className="px-2 py-1 rounded" style={{ background: "#1d2218" }}>›</button>
            </div>
          </div>
          <nav className="flex gap-1">
            {[["grid", "Графік"], ["people", "Особовий склад"], ["posts", "Пости"], ["summary", "Підсумки"]].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)}
                className="px-3 py-2 rounded-lg text-sm font-medium"
                style={tab === id ? { background: "#e8e6dd", color: "#10130e" } : { background: "#1d2218", color: "#c9c7ba" }}>
                {label}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="p-4 print-root">
        {!loaded ? (
          <div className="text-center py-16" style={{ color: "#8a9070" }}>Завантаження…</div>
        ) : tab === "grid" ? (
          <GridTab {...{ people, posts, monthSched, days, ym, tool, setTool, cellClick, restConflict, coverage, dutyCount, autoFill, clearMonth, exportCsv, postById, isToday, loadDemo, restDays, setRestDays, autoFrom: autoFromClamped, setAutoFrom, autoDays: autoDaysClamped, setAutoDays, filterDay, setFilterDay, exportData, importData }} />
        ) : tab === "people" ? (
          <PeopleTab {...{ people, setPeople, posts, loadDemo }} />
        ) : tab === "posts" ? (
          <PostsTab {...{ posts, setPosts }} />
        ) : (
          <SummaryTab {...{ people, posts, monthSched, coverage, days, dutyCount, ym }} />
        )}
      </main>

      {toast && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm no-print"
          style={{ background: "#e8e6dd", color: "#10130e", boxShadow: "0 4px 20px #0008" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ───────── Вкладка: Графік ───────── */

function ImportButton({ onFile, label, className, style }) {
  const ref = useRef(null);
  return (
    <>
      <input ref={ref} type="file" accept=".json,application/json" style={{ display: "none" }}
        onChange={(e) => { const f = e.target.files[0]; if (f) onFile(f); e.target.value = ""; }} />
      <button onClick={() => ref.current.click()} className={className} style={style}>{label}</button>
    </>
  );
}

function GridTab({ people, posts, monthSched, days, ym, tool, setTool, cellClick, restConflict, coverage, dutyCount, autoFill, clearMonth, exportCsv, postById, isToday, loadDemo, restDays, setRestDays, autoFrom, setAutoFrom, autoDays, setAutoDays, filterDay, setFilterDay, exportData, importData }) {
  if (!people.length) {
    return (
      <div className="text-center py-16">
        <p className="mb-1 text-lg font-semibold">Список особового складу порожній</p>
        <p className="mb-5 text-sm" style={{ color: "#8a9070" }}>Додай людей на вкладці «Особовий склад», завантаж збережений файл даних або почни з прикладу.</p>
        <div className="flex justify-center gap-2">
          <button onClick={loadDemo} className="px-4 py-2 rounded-lg font-medium" style={{ background: "#4a6b2f", color: "#fff" }}>
            Додати приклад даних
          </button>
          <ImportButton onFile={importData} label="⤓ Завантажити з файлу"
            className="px-4 py-2 rounded-lg font-medium" style={{ background: "#1d2218", color: "#c9c7ba" }} />
        </div>
      </div>
    );
  }

  const sched = monthSched;
  const [py, pm] = ym.split("-").map(Number);

  return (
    <div>
      {/* Заголовок лише для друку */}
      <div className="print-only" style={{ marginBottom: "6px" }}>
        <div style={{ fontWeight: 700, fontSize: "14pt" }}>Графік чергувань — {MONTHS[pm - 1]} {py}</div>
      </div>
      {/* Панель інструментів */}
      <div className="flex flex-wrap items-center gap-2 mb-3 no-print">
        <span className="text-xs uppercase tracking-wider mr-1" style={{ color: "#8a9070" }}>Постав на:</span>
        {posts.map((p) => (
          <button key={p.id} onClick={() => setTool(p.id)}
            className="px-3 py-1.5 rounded-lg text-sm font-semibold"
            style={{
              background: tool === p.id ? p.color : "#1d2218",
              color: tool === p.id ? "#fff" : "#c9c7ba",
              border: `1px solid ${p.color}`,
            }}>
            {p.short} · {p.name}
          </button>
        ))}
        <button onClick={() => setTool("erase")}
          className="px-3 py-1.5 rounded-lg text-sm font-semibold"
          style={{ background: tool === "erase" ? "#e8e6dd" : "#1d2218", color: tool === "erase" ? "#10130e" : "#c9c7ba", border: "1px solid #555" }}>
          ✕ Стерти
        </button>
        <div className="grow" />
        <label className="text-xs flex items-center gap-1" style={{ color: "#8a9070" }}>
          Відпочинок між нарядами:
          <select value={restDays} onChange={(e) => setRestDays(Number(e.target.value))}
            className="rounded px-1 py-0.5" style={{ background: "#1d2218", color: "#e8e6dd" }}>
            {[0, 1, 2, 3].map((n) => <option key={n} value={n}>{n} дн.</option>)}
          </select>
        </label>
        <label className="text-xs flex items-center gap-1" title="Сховати тих, хто не в наряді у це число" style={{ color: "#8a9070" }}>
          Хто в наряді:
          <select value={filterDay ?? ""} onChange={(e) => setFilterDay(e.target.value ? Number(e.target.value) : null)}
            className="rounded px-1 py-0.5" style={{ background: "#1d2218", color: "#e8e6dd" }}>
            <option value="">Всі</option>
            {Array.from({ length: days }, (_, i) => i + 1).map((d) => <option key={d} value={d}>{d} число</option>)}
          </select>
        </label>
        <label className="text-xs flex items-center gap-1" title="Діапазон днів для «Авторозподіл» і «Очистити»" style={{ color: "#8a9070" }}>
          Діапазон днів — з числа:
          <input type="number" min={1} max={days} value={autoFrom}
            onChange={(e) => setAutoFrom(Math.min(days, Math.max(1, Number(e.target.value) || 1)))}
            className="rounded px-1 py-0.5 text-center" style={{ width: "3rem", background: "#1d2218", color: "#e8e6dd" }} />
          на
          <input type="number" min={1} max={days} value={autoDays}
            onChange={(e) => setAutoDays(Math.min(days, Math.max(1, Number(e.target.value) || 1)))}
            className="rounded px-1 py-0.5 text-center" style={{ width: "3.2rem", background: "#1d2218", color: "#e8e6dd" }} />
          дн.
        </label>
        <button onClick={autoFill} className="px-3 py-1.5 rounded-lg text-sm font-semibold" style={{ background: "#4a6b2f", color: "#fff" }}>
          ⚙ Авторозподіл
        </button>
        <button onClick={exportCsv} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>CSV</button>
        <button onClick={() => window.print()} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>Друк</button>
        <button onClick={exportData} title="Зберегти всі дані у файл — для передачі чи резервної копії"
          className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>⤒ Зберегти дані</button>
        <ImportButton onFile={importData} label="⤓ Завантажити дані"
          className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }} />
        <button onClick={clearMonth} title="Очищає той самий діапазон днів, що й авторозподіл"
          className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218", color: "#d08a7a" }}>
          {autoFrom === 1 && autoFrom + autoDays - 1 >= days ? "Очистити" : `Очистити з ${autoFrom}`}
        </button>
      </div>

      <p className="text-xs mb-2 no-print" style={{ color: "#8a9070" }}>
        Обери пост зверху і клацай по клітинках. Повторний клік — зняти. Помаранчева рамка — порушено відпочинок між нарядами.
        {filterDay && <span> Показано лише тих, хто в наряді {filterDay} числа — <button onClick={() => setFilterDay(null)} className="underline" style={{ color: "#c9c7ba" }}>показати всіх</button>.</span>}
      </p>

      {/* Сітка */}
      <div className="grid-wrap overflow-auto rounded-lg" style={{ border: "1px solid #2a2f24", maxHeight: "72vh" }}>
        <table style={{ borderCollapse: "collapse", fontSize: "12px" }}>
          <thead>
            <tr style={{ position: "sticky", top: 0, zIndex: 3, background: "#171b13" }}>
              <th className="px-2 py-1 text-left" style={{ position: "sticky", left: 0, background: "#171b13", minWidth: "13rem", zIndex: 4 }}>ПІБ / звання</th>
              {Array.from({ length: days }, (_, i) => i + 1).map((d) => {
                const w = wdOf(ym, d);
                const weekend = w === 0 || w === 6;
                return (
                  <th key={d} className="px-0.5 py-1 text-center" style={{
                    minWidth: "2rem",
                    color: weekend ? "#d0a060" : "#c9c7ba",
                    background: isToday(d) ? "#3a4032" : undefined,
                  }}>
                    <div>{d}</div>
                    <div style={{ fontSize: "9px", color: weekend ? "#d0a060" : "#777d68" }}>{WD[w]}</div>
                  </th>
                );
              })}
              <th className="px-2 py-1" style={{ minWidth: "3rem" }}>Σ</th>
            </tr>
          </thead>
          <tbody>
            {ROLES.map((role) => {
              const group = people
                .filter((p) => p.role === role && p.active !== false)
                .filter((p) => !filterDay || (sched[p.id] && sched[p.id][filterDay]));
              if (!group.length) return null;
              return [
                <tr key={role + "-h"}>
                  <td colSpan={days + 2} className="print-group px-2 py-1 text-xs font-bold uppercase tracking-wider"
                    style={{ background: "#1d2218", color: "#8a9070", position: "sticky", left: 0 }}>
                    {role} — {group.length}
                  </td>
                </tr>,
                ...group.map((p) => (
                  <tr key={p.id} style={{ borderTop: "1px solid #22271d" }}>
                    <td className="px-2 py-1 whitespace-nowrap" style={{ position: "sticky", left: 0, background: "#10130e", zIndex: 2 }}>
                      <div className="font-medium">{p.name}</div>
                      <div style={{ fontSize: "10px", color: "#777d68" }}>{p.rank}</div>
                    </td>
                    {Array.from({ length: days }, (_, i) => i + 1).map((d) => {
                      const pid = (sched[p.id] || {})[d];
                      const post = pid ? postById[pid] : null;
                      const conflict = pid && restConflict(sched, p.id, d);
                      const w = wdOf(ym, d);
                      const weekend = w === 0 || w === 6;
                      return (
                        <td key={d} onClick={() => cellClick(p.id, d)}
                          className="cell text-center cursor-pointer select-none"
                          title={post ? `${post.name}${conflict ? " — порушено відпочинок" : ""}` : ""}
                          style={{
                            background: post ? post.color : weekend ? "#161a12" : "transparent",
                            color: "#fff",
                            fontWeight: 700,
                            fontSize: "10px",
                            height: "26px",
                            boxShadow: conflict ? "inset 0 0 0 2px #ff9933" : undefined,
                            borderLeft: "1px solid #1c2017",
                          }}>
                          {post ? post.short : ""}
                        </td>
                      );
                    })}
                    <td className="text-center font-bold" style={{ color: "#c9c7ba" }}>{dutyCount(p.id) || ""}</td>
                  </tr>
                )),
              ];
            })}

            {/* Покриття постів */}
            <tr><td colSpan={days + 2} className="print-group px-2 py-1 text-xs font-bold uppercase tracking-wider"
              style={{ background: "#1d2218", color: "#8a9070", position: "sticky", left: 0 }}>Покриття постів (є / треба)</td></tr>
            {posts.map((post) => (
              <tr key={"cov-" + post.id} style={{ borderTop: "1px solid #22271d" }}>
                <td className="px-2 py-1 whitespace-nowrap font-medium" style={{ position: "sticky", left: 0, background: "#10130e", zIndex: 2 }}>
                  <span className="no-print inline-block w-2.5 h-2.5 rounded-sm mr-1.5" style={{ background: post.color }} />
                  {post.name}
                  <div style={{ fontSize: "9px", color: "#777d68", fontWeight: 400 }}>{reqText(post)}</div>
                </td>
                {Array.from({ length: days }, (_, i) => i + 1).map((d) => {
                  const c = coverage[post.id]?.[d] || { have: 0, need: totalReq(post), missing: [] };
                  const ok = !c.missing.length;
                  return (
                    <td key={d} className="text-center" title={ok ? "" : `Бракує: ${c.missing.join(", ")}`} style={{
                      fontSize: "10px",
                      height: "22px",
                      color: ok ? "#7fa86a" : "#ff7a5c",
                      fontWeight: ok ? 400 : 700,
                      background: ok ? "transparent" : "#3a1c14",
                      borderLeft: "1px solid #1c2017",
                    }}>
                      {c.have}/{c.need}
                    </td>
                  );
                })}
                <td />
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Легенда лише для друку */}
      <div className="print-only" style={{ marginTop: "4px", fontSize: "7pt" }}>
        <div>Умовні позначення: {posts.map((p) => `${p.short} — ${p.name} (${reqText(p)})`).join("; ")}.</div>
        <div style={{ marginTop: "8px" }}>Склав: ______________________ &nbsp;&nbsp;&nbsp; Дата: «____» ____________ {py} р.</div>
      </div>
    </div>
  );
}

/* ───────── Вкладка: Особовий склад ───────── */

function PeopleTab({ people, setPeople, posts, loadDemo }) {
  const [form, setForm] = useState({ name: "", rank: "", role: ROLES[0], posts: [] });

  const togglePost = (arr, id) => arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id];

  const add = () => {
    if (!form.name.trim()) return;
    setPeople((prev) => [...prev, { ...form, name: form.name.trim(), id: uid(), active: true }]);
    setForm({ name: "", rank: "", role: form.role, posts: form.posts });
  };

  const update = (id, patch) => setPeople((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const remove = (id) => { if (confirm("Видалити з усіх графіків?")) setPeople((prev) => prev.filter((p) => p.id !== id)); };

  return (
    <div className="max-w-4xl">
      {/* Форма */}
      <div className="rounded-lg p-3 mb-4 flex flex-wrap gap-2 items-end" style={{ background: "#171b13", border: "1px solid #2a2f24" }}>
        <label className="text-xs" style={{ color: "#8a9070" }}>ПІБ
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })}
            onKeyDown={(e) => e.key === "Enter" && add()}
            placeholder="Прізвище І.Б." className="block mt-1 px-2 py-1.5 rounded w-44"
            style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
        </label>
        <label className="text-xs" style={{ color: "#8a9070" }}>Звання
          <input value={form.rank} onChange={(e) => setForm({ ...form, rank: e.target.value })}
            placeholder="сержант" className="block mt-1 px-2 py-1.5 rounded w-32"
            style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
        </label>
        <label className="text-xs" style={{ color: "#8a9070" }}>Категорія
          <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}
            className="block mt-1 px-2 py-1.5 rounded" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }}>
            {ROLES.map((r) => <option key={r}>{r}</option>)}
          </select>
        </label>
        <div className="text-xs" style={{ color: "#8a9070" }}>Допущений до постів
          <div className="flex gap-1 mt-1 flex-wrap">
            {posts.map((p) => (
              <button key={p.id} onClick={() => setForm({ ...form, posts: togglePost(form.posts, p.id) })}
                className="px-2 py-1 rounded text-xs font-semibold"
                style={{
                  background: form.posts.includes(p.id) ? p.color : "#10130e",
                  color: form.posts.includes(p.id) ? "#fff" : "#777d68",
                  border: `1px solid ${form.posts.includes(p.id) ? p.color : "#2a2f24"}`,
                }}>
                {p.short}
              </button>
            ))}
          </div>
        </div>
        <button onClick={add} className="px-4 py-1.5 rounded-lg font-semibold" style={{ background: "#4a6b2f", color: "#fff" }}>+ Додати</button>
        {!people.length && (
          <button onClick={loadDemo} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#1d2218" }}>Приклад даних</button>
        )}
      </div>

      {/* Список */}
      {ROLES.map((role) => {
        const group = people.filter((p) => p.role === role);
        if (!group.length) return null;
        return (
          <div key={role} className="mb-4">
            <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#8a9070" }}>{role} — {group.length}</div>
            {group.map((p) => (
              <div key={p.id} className="flex flex-wrap items-center gap-2 px-3 py-2 rounded-lg mb-1"
                style={{ background: "#171b13", border: "1px solid #2a2f24", opacity: p.active === false ? 0.45 : 1 }}>
                <input value={p.name} onChange={(e) => update(p.id, { name: e.target.value })}
                  className="px-2 py-1 rounded w-44 font-medium" style={{ background: "transparent", border: "1px solid transparent", color: "#e8e6dd" }} />
                <input value={p.rank || ""} onChange={(e) => update(p.id, { rank: e.target.value })}
                  placeholder="звання" className="px-2 py-1 rounded w-32 text-sm" style={{ background: "transparent", border: "1px solid transparent", color: "#8a9070" }} />
                <select value={p.role} onChange={(e) => update(p.id, { role: e.target.value })}
                  className="px-2 py-1 rounded text-sm" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }}>
                  {ROLES.map((r) => <option key={r}>{r}</option>)}
                </select>
                <div className="flex gap-1">
                  {posts.map((post) => (
                    <button key={post.id} onClick={() => update(p.id, { posts: togglePost(p.posts, post.id) })}
                      title={post.name}
                      className="px-2 py-1 rounded text-xs font-semibold"
                      style={{
                        background: p.posts.includes(post.id) ? post.color : "#10130e",
                        color: p.posts.includes(post.id) ? "#fff" : "#555c4a",
                        border: `1px solid ${p.posts.includes(post.id) ? post.color : "#2a2f24"}`,
                      }}>
                      {post.short}
                    </button>
                  ))}
                </div>
                <div className="grow" />
                <button onClick={() => update(p.id, { active: p.active === false ? true : false })}
                  className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#c9c7ba" }}>
                  {p.active === false ? "Повернути" : "Відпустка/ВЛК"}
                </button>
                <button onClick={() => remove(p.id)} className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#d08a7a" }}>✕</button>
              </div>
            ))}
          </div>
        );
      })}
      {people.length > 0 && (
        <p className="text-xs" style={{ color: "#777d68" }}>
          «Відпустка/ВЛК» тимчасово виключає людину з графіка та авторозподілу, не видаляючи її.
        </p>
      )}
    </div>
  );
}

/* ───────── Вкладка: Пости ───────── */

function PostsTab({ posts, setPosts }) {
  const COLORS = ["#4a6b2f", "#2f6f9f", "#a8402f", "#2e8572", "#a87514", "#6b4a8a", "#8a6b2f", "#4a8a8a"];
  const update = (id, patch) => setPosts((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const add = () => setPosts((prev) => [...prev, { id: uid(), name: "Новий пост", short: "НП", color: COLORS[prev.length % COLORS.length], req: { [ANY]: 1 } }]);
  const remove = (id) => { if (confirm("Видалити пост? Призначення на нього зникнуть з відображення.")) setPosts((prev) => prev.filter((p) => p.id !== id)); };

  const setReq = (p, key, value) => {
    const n = Math.max(0, Math.min(9, Number(value) || 0));
    const req = { ...normReq(p) };
    if (n === 0) delete req[key];
    else req[key] = n;
    update(p.id, { req });
  };

  return (
    <div className="max-w-4xl">
      <p className="text-sm mb-3" style={{ color: "#8a9070" }}>
        «Склад на добу» — скільки і кого має бути на посту щодня. «Будь-хто» — місця без вимоги до категорії.
        Це використовують авторозподіл і контроль покриття.
      </p>
      {posts.map((p) => {
        const req = normReq(p);
        return (
        <div key={p.id} className="flex flex-wrap items-center gap-2 px-3 py-2 rounded-lg mb-1"
          style={{ background: "#171b13", border: "1px solid #2a2f24" }}>
          <input value={p.name} onChange={(e) => update(p.id, { name: e.target.value })}
            className="px-2 py-1 rounded w-44 font-medium" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
          <label className="text-xs" style={{ color: "#8a9070" }}>Код
            <input value={p.short} maxLength={3} onChange={(e) => update(p.id, { short: e.target.value.toUpperCase() })}
              className="ml-1 px-2 py-1 rounded w-14 text-center font-bold" style={{ background: "#10130e", border: "1px solid #2a2f24", color: "#e8e6dd" }} />
          </label>
          <div className="flex gap-1">
            {COLORS.map((c) => (
              <button key={c} onClick={() => update(p.id, { color: c })}
                className="w-6 h-6 rounded"
                style={{ background: c, outline: p.color === c ? "2px solid #e8e6dd" : "none", outlineOffset: "1px" }} />
            ))}
          </div>
          <div className="grow" />
          <span className="text-xs font-semibold" style={{ color: "#c9c7ba" }}>Разом: {totalReq(p)}</span>
          <button onClick={() => remove(p.id)} className="px-2 py-1 rounded text-xs" style={{ background: "#1d2218", color: "#d08a7a" }}>✕</button>
          <div className="w-full flex flex-wrap items-center gap-x-3 gap-y-1 pt-1" style={{ borderTop: "1px solid #22271d" }}>
            <span className="text-xs uppercase tracking-wider" style={{ color: "#8a9070" }}>Склад на добу:</span>
            {[ANY, ...ROLES].map((key) => {
              const n = req[key] || 0;
              return (
                <label key={key} className="text-xs flex items-center gap-1" style={{ color: n > 0 ? "#e8e6dd" : "#555c4a" }}>
                  {reqLabel(key)}
                  <input type="number" min={0} max={9} value={n}
                    onChange={(e) => setReq(p, key, e.target.value)}
                    className="px-1 py-0.5 rounded w-11 text-center"
                    style={{
                      background: "#10130e",
                      border: `1px solid ${n > 0 ? p.color : "#2a2f24"}`,
                      color: n > 0 ? "#e8e6dd" : "#555c4a",
                      fontWeight: n > 0 ? 700 : 400,
                    }} />
                </label>
              );
            })}
          </div>
        </div>
        );
      })}
      <button onClick={add} className="mt-2 px-4 py-1.5 rounded-lg font-semibold" style={{ background: "#4a6b2f", color: "#fff" }}>+ Додати пост</button>
    </div>
  );
}

/* ───────── Вкладка: Підсумки ───────── */

function SummaryTab({ people, posts, monthSched, coverage, days, dutyCount, ym }) {
  const byPost = (personId) => {
    const res = {};
    Object.values(monthSched[personId] || {}).forEach((pid) => { res[pid] = (res[pid] || 0) + 1; });
    return res;
  };

  const gaps = posts.map((post) => {
    const bad = [];
    for (let d = 1; d <= days; d++) {
      const c = coverage[post.id]?.[d];
      if (c && c.missing.length) bad.push({ d, missing: c.missing });
    }
    return { post, bad };
  }).filter((g) => g.bad.length);

  const active = people.filter((p) => p.active !== false);
  const counts = active.map((p) => dutyCount(p.id));
  const max = Math.max(1, ...counts);

  return (
    <div className="max-w-3xl">
      {/* Незакриті зміни */}
      <h2 className="font-bold mb-2">Незакриті зміни</h2>
      {!gaps.length ? (
        <p className="text-sm mb-5" style={{ color: "#7fa86a" }}>✓ Усі пости закриті щодня.</p>
      ) : (
        <div className="mb-5">
          {gaps.map(({ post, bad }) => (
            <div key={post.id} className="px-3 py-2 rounded-lg mb-1 text-sm" style={{ background: "#3a1c14", border: "1px solid #5a2c20" }}>
              <span className="font-semibold" style={{ color: "#ff9a7c" }}>{post.name}</span>
              <span style={{ color: "#c9a08f" }}> ({reqText(post)})</span> — не вистачає:{" "}
              {bad.map(({ d, missing }) => `${d} число (${missing.join(", ")})`).join("; ")}
            </div>
          ))}
        </div>
      )}

      {/* Навантаження */}
      <h2 className="font-bold mb-2">Навантаження за місяць</h2>
      <div className="rounded-lg p-3" style={{ background: "#171b13", border: "1px solid #2a2f24" }}>
        {ROLES.map((role) => {
          const group = active.filter((p) => p.role === role);
          if (!group.length) return null;
          return (
            <div key={role} className="mb-3">
              <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#8a9070" }}>{role}</div>
              {group.sort((a, b) => dutyCount(b.id) - dutyCount(a.id)).map((p) => {
                const n = dutyCount(p.id);
                const parts = byPost(p.id);
                return (
                  <div key={p.id} className="flex items-center gap-2 mb-1 text-sm">
                    <div className="w-40 truncate">{p.name}</div>
                    <div className="grow h-4 rounded overflow-hidden flex" style={{ background: "#10130e" }}>
                      {posts.map((post) => {
                        const k = parts[post.id] || 0;
                        if (!k) return null;
                        return <div key={post.id} title={`${post.name}: ${k}`} style={{ width: `${(k / max) * 100}%`, background: post.color }} />;
                      })}
                    </div>
                    <div className="w-8 text-right font-bold">{n}</div>
                  </div>
                );
              })}
            </div>
          );
        })}
        <div className="flex flex-wrap gap-3 mt-2 pt-2 text-xs" style={{ borderTop: "1px solid #2a2f24", color: "#8a9070" }}>
          {posts.map((p) => (
            <span key={p.id}><span className="inline-block w-2.5 h-2.5 rounded-sm mr-1" style={{ background: p.color }} />{p.name}</span>
          ))}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<DutyRoster />);

</script>
</body>
</html>
